function answersOf(q){return [q.answer,...(q.alternatives||[])].map(a=>a.split(/\s+/).map((w,i)=>w.endsWith(',')?i:-1).filter((i,_,arr)=>i>=0&&i<a.split(/\s+/).length-1))}
function textWords(q){return q.answer.replaceAll(',','').split(/\s+/)}
function equalArr(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function normalized(sel){return [...sel].sort((a,b)=>a-b)}
function valid(q,sel){let s=normalized(sel);return answersOf(q).some(a=>equalArr(s,a))}
function correctGaps(q,sel){if(valid(q,sel))return normalized(sel);const alternatives=answersOf(q);let closest=alternatives[0],dist=Infinity;for(const alt of alternatives){const setA=new Set(alt),setB=new Set(sel);const d=[...setA].filter(x=>!setB.has(x)).length+[...setB].filter(x=>!setA.has(x)).length;if(d<dist){dist=d;closest=alt}}return closest}
function drawSentence(q,sel,checked,exam){let words=textWords(q),basis=correctGaps(q,sel);return `<div class="sentence" role="group" aria-label="Beistriche im Satz setzen">${words.map((w,i)=>`<span class="word">${esc(w)}</span>${i<words.length-1?`<button class="gap-slot ${sel.includes(i)?'selected':''} ${checked?sel.includes(i)?basis.includes(i)?'correct':'bad':basis.includes(i)?'missed':'readonly':''}" ${checked?'disabled':''} data-gap="${i}" type="button" aria-label="Beistrich nach ${esc(w)} ${sel.includes(i)?'entfernen':'setzen'}" aria-pressed="${sel.includes(i)?'true':'false'}"></button>`:''}`).join('')}</div>`}
function sessionUI(){if(session.done)return resultPage();const q=BYID[session.items[session.index]],sel=session.selection||[],right=session.checked&&valid(q,sel);let elapsed=session.seconds>0?Math.max(0,session.seconds-Math.floor((Date.now()-session.start)/1000)):0, mins=String(Math.floor(elapsed/60)).padStart(2,'0'),secs=String(elapsed%60).padStart(2,'0');return `<div class="challenge"><div class="row wrap" style="justify-content:space-between;margin-bottom:18px"><button class="backlink" data-action="exit-session">← Training verlassen</button><span class="tag ${session.kind==='exam'?'amber':'purple'}">${session.kind==='exam'?'Prüfungsmodus':'Interaktives Training'}</span></div><div class="challenge-top"><div class="smalltext strong">Satz ${session.index+1} von ${session.items.length}</div><div class="row">${session.seconds?`<span id="countdown" class="timer ${elapsed<60?'urgent':''}">${ic('clock')} ${mins}:${secs}</span>`:''}<span class="tag">${['','Leicht','Mittel','Schwer'][q.level]}</span></div></div><div class="progress" style="margin-bottom:20px"><span style="width:${pct(session.index,session.items.length)}%"></span></div><div class="challenge-card"><div class="kicker">${esc(LESSONS.find(m=>m.id===q.lesson).title)}</div><h2 style="font-size:clamp(21px,3vw,29px);letter-spacing:-.6px;margin:8px 0 4px">Wo gehören die Beistriche hin?</h2><p class="question-text">Tippe auf die kleinen Punkte zwischen den Wörtern. Jede gesetzte Markierung entspricht einem Beistrich.</p>${drawSentence(q,sel,session.checked,session.kind==='exam')}<div class="instructions">${ic('info')} Auch ein Satz ohne Beistrich kann richtig sein. Manche Regeln erlauben mehrere Lösungen.</div>${session.checked&&session.kind!=='exam'?`<div class="feedback ${right?'':'wrong'}"><h3>${right?'✓ Perfekt – genau richtig!':'Fast geschafft? Schau dir die Regel an.'}</h3><p class="smalltext muted">${right?'Du hast alle erforderlichen Stellen richtig erkannt.':'Deine Lösung hat mindestens einen fehlenden oder zusätzlichen Beistrich.'}</p><div class="smalltext strong" style="margin-top:14px">${right?'Eine mögliche Musterlösung:':'Richtige Musterlösung:'}</div><div class="correct-sentence">${esc(q.answer)}</div>${q.alternatives.length?`<p class="smalltext"><b>Auch erlaubt:</b> ${q.alternatives.map(esc).join(' · ')}</p>`:''}<p>${esc(q.why)}</p><div class="smalltext muted">Grün = richtig gesetzt · Gelb = fehlender Beistrich · Rot = zusätzlich gesetzter Beistrich.</div></div>`:''}<div class="exercise-actions">${session.kind==='exam'?`<button class="btn" data-action="exam-next">${session.index===session.items.length-1?'Test abgeben':'Übernehmen & weiter'} ${ic('arrow')}</button>`:session.checked?`<button class="btn" data-action="next-question">${session.index===session.items.length-1?'Ergebnis ansehen':'Nächster Satz'} ${ic('arrow')}</button>`:`<button class="btn" data-action="check-question">Überprüfen ${ic('check')}</button>`}<button class="btn secondary" data-action="clear-gaps" ${session.checked?'disabled':''}>Beistriche entfernen</button>${session.kind==='exam'?`<span class="smalltext muted">Keine Korrektur vor Abgabe</span>`:''}</div></div><div class="row wrap" style="margin-top:18px;justify-content:space-between"><span class="muted tiny">${session.kind==='exam'?'Deine Lösungen werden am Ende bewertet.':'Jede Antwort bekommt eine eigene Erklärung.'}</span><span class="tiny muted">${session.kind==='exam'?'Probetest':'Lernen ohne Zeitdruck'}</span></div></div>`}
function finish(){if(!session||session.done)return;session.done=true;let right=0;for(let i=0;i<session.items.length;i++){let q=BYID[session.items[i]],sel=session.results[i]||[];if(valid(q,sel))right++;if(session.kind==='exam')record(q,valid(q,sel),session.kind)}session.score=right;if(session.kind==='exam'){store.bestExam=Math.max(store.bestExam,pct(right,session.items.length));save()}render();}
function resultPage(){const total=session.items.length,right=session.score,p=pct(right,total);let headline=p>=90?'Sehr stark – das war prüfungssicher!':p>=70?'Guter Fortschritt – jetzt die Lücken schließen.':'Die Grundlagen bauen wir gemeinsam weiter auf.';return `<div class="challenge">${title(session.kind==='exam'?'DEIN PROBETEST':'TRAINING ABGESCHLOSSEN','Dein Ergebnis',headline)}<div class="card"><span class="tag ${p>=90?'green':p>=70?'purple':'amber'}">${p>=90?'Ziel erreicht':p>=70?'Auf gutem Weg':'Weiter trainieren'}</span><div class="result-big">${p}<span>%</span></div><p class="muted">${right} von ${total} Sätzen vollständig richtig gelöst</p><div class="progress" style="margin:16px 0 21px"><span style="width:${p}%"></span></div><div class="row wrap"><button class="btn" data-action="repeat-session">Nochmal trainieren ${ic('reload')}</button><button class="btn secondary" data-nav="fehler">Fehler gezielt üben</button><button class="btn ghost" data-nav="start">Zur Übersicht</button></div></div><div class="section-head"><h2 class="heading">Lösungen und Begründungen</h2><span class="tag">${total} Aufgaben</span></div>${session.items.map((id,i)=>{let q=BYID[id],right=valid(q,session.results[i]||[]);return `<details class="result-row"><summary><span>${right?'<span class="good">✓</span>':'<span class="badtext">✕</span>'} ${i+1}. ${esc(textWords(q).slice(0,8).join(' '))}${textWords(q).length>8?' …':''}</span><span class="tag ${right?'green':'amber'}">${right?'Richtig':'Üben'}</span></summary><p><b>Musterlösung:</b> ${esc(q.answer)}</p>${q.alternatives.length?`<p><b>Auch möglich:</b> ${q.alternatives.map(esc).join(' / ')}</p>`:''}<p><b>Warum?</b> ${esc(q.why)}</p><p class="tiny">${esc(LESSONS.find(x=>x.id===q.lesson).title)}</p></details>`}).join('')}<div class="card" style="margin-top:23px"><strong>Dein nächster Schritt</strong><p class="smalltext muted">Öffne das Fehlertraining und löse deine falsch beantworteten Sätze erneut. Danach mache einen frischen Probetest. Mit zwei Ergebnissen über 90 % hast du ein gutes Trainingsziel erreicht.</p></div></div>`}

function whyReasonOptions(q){let distractors={aufzaehlung:['Die einzelnen Teile bilden zwei vollständige Hauptsätze mit eigenen konjugierten Verben.','Die zusätzliche Wortgruppe beschreibt eine bestimmte Person genauer und ist eine Apposition.','Hier wird eine Person direkt angeredet.'],hauptsatzreihe:['„Dass“, „weil“ oder „falls“ leitet einen abhängigen Gliedsatz ein.','Die Wörter sind mehrere gleichrangige Gegenstände oder Tätigkeiten einer Aufzählung.','Ein Relativpronomen leitet eine nähere Erklärung zu einem Nomen ein.'],konjunktion:['Es folgen zwei unabhängige Hauptsätze ohne Bindewort.','Eine indirekte Frage wird mit ob oder einem Fragewort wiedergegeben.','Ein Partizip wie „lachend“ leitet eine eingeschobene Wortgruppe ein.'],relativ:['Der Satz gibt eine Frage wieder, die nicht direkt gestellt wird.','Eine Konjunktion wie weil oder dass beginnt einen begründenden Gliedsatz.','Eine Apposition ist ein nachgestelltes Nomen ohne eigenes konjugiertes Verb.'],indirekt:['Ein Relativsatz beschreibt ein Nomen und beginnt mit einem Relativpronomen.','Zwei selbstständige Hauptsätze stehen ohne Bindewort aneinander.','Die Wörter werden in einer gleichrangigen Aufzählung aneinandergereiht.'],infinitiv:['Ein mit weil beginnender Gliedsatz enthält ein konjugiertes Verb am Ende.','Die Wortgruppe ist eine Partizipialgruppe mit der Endung -end.','Zwischen zwei vollständigen Hauptsätzen steht ein Beistrich.'],apposition:['Die zusätzliche Gruppe gibt die Frage nach einem Ort oder Zeitpunkt indirekt wieder.','Eine Person wird direkt angesprochen und muss auf die Frage antworten.','Eine mit „ohne ... zu“ eingeleitete Gruppe wird abgetrennt.'],anrede:['Ein nachgestellter Beisatz benennt das Nomen genauer, ohne jemanden direkt anzusprechen.','Die Äußerung ist ein selbstständiger Gefühlsausruf wie „igitt“.','Ein Relativsatz beginnt mit einem Relativpronomen und beschreibt das Bezugsnomen.'],ausruf:['Es wird eine konkrete Person direkt angesprochen.','Ein „dass“-Gliedsatz wird vom Hauptsatz getrennt.','Ein nachgestellter Beisatz bezeichnet eine Person nochmals.'],direkte:['Der Satz enthält einen mit „weil“ eingeleiteten Gliedsatz.','Die Wortgruppe wird vom restlichen Satz als Anrede abgetrennt.','Es werden drei gleichrangige Bestandteile aufgezählt.'],partizip:['Die Wortgruppe enthält einen Infinitiv mit „zu“ und kein Partizip.','Ein Relativpronomen verbindet einen Gliedsatz mit einem Nomen.','Die Wortgruppe ist eine Apposition in Form eines nachgestellten Nomens.'],einschub:['Der Zusatz ist ein vollständiger „weil“-Gliedsatz.','Der Zusatz spricht den Leser direkt mit Namen an.','Es stehen zwei vollständige Hauptsätze ohne Bindewort nebeneinander.'],kein:['Ein mit „als“ eingeleiteter Vergleich ist immer ein Gliedsatz und braucht einen Beistrich.','Zwischen allen zwei Adjektiven oder Nomen muss ein Beistrich stehen.','Bei jeder Satzpause ist ein Beistrich erforderlich.']};return whyShuffle([q.why,...distractors[q.category]],74+Number(q.id.slice(1)))}

function whyBegin(filter,test=false){let qs=whyPool(filter);if(!qs.length){toast('Noch keine passenden Aufgaben vorhanden.');return}whyConfig={filter,test};whySession={ids:(filter==='blatt'&&!test?qs:whyShuffle(qs,713)).map(x=>x.id),index:0,selected:[],rule:null,reason:null,own:'',checked:false,answers:[],test,started:Date.now(),done:false};session=null;page='erklaeren';render();window.scrollTo({top:0,behavior:'instant'})}

 const act=elem.dataset.action;if(!act)return;
 if(act==='why-clear'&&whySession&&!whySession.checked){whySession.selected=[];render();return}
 if(act==='why-check'&&whySession&&!whySession.checked&&!whySession.test){if(!whySession.rule||!whySession.reason){toast('Bitte beantworte auch Regel und Warum-Frage.');return}whySession.checked=true;render();return}
 if(act==='why-next'&&whySession){if(whySession.test&&(!whySession.rule||!whySession.reason)){toast('Wähle zuerst Regel und Begründung.');return}whyAdvance();return}
 if(act==='why-exit'&&whySession){if(confirm('Möchtest du dieses Training verlassen?'))go('erklaeren');return}
 if(act==='theme'){store.theme=store.theme==='dark'?'light':'dark';save();render();return}
 if(act==='start-day'){beginDay(+elem.dataset.day);return}
 if(act==='start-free'){beginFree();return}
 if(act==='start-exam'){beginExam();return}
 if(act==='start-errors'){beginErrors();return}
 if(act==='flip'){showCard=!showCard;render();return}
 if(act==='next-card'){cardIndex=(cardIndex+1)%cardOrder.length;showCard=false;render();return}
 if(act==='prev-card'){cardIndex=(cardIndex+cardOrder.length-1)%cardOrder.length;showCard=false;render();return}
 if(act==='clear-gaps'&&session&&!session.checked){session.selection=[];render();return}
 if(act==='check-question'&&session&&!session.checked){const q=BYID[session.items[session.index]];session.results[session.index]=[...session.selection];session.checked=true;record(q,valid(q,session.selection),'practice');render();return}
 if(act==='next-question'&&session&&session.checked){take();return}
 if(act==='exam-next'&&session&&session.kind==='exam'){take();return}
 if(act==='exit-session'){if(confirm('Möchtest du das laufende Training wirklich verlassen? Nicht abgegebene Ergebnisse gehen verloren.'))go('start');return}
 if(act==='repeat-session'&&session){begin(session.kind,shuffled(session.items),session.seconds);return}
});
document.addEventListener('input',e=>{if(e.target.id==='own-why'&&whySession)whySession.own=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='scope')config.scope=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.dataset?.action==='flip'){e.preventDefault();showCard=!showCard;render()}});
render();
</script>
</body>
</html>
