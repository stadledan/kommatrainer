/* Begründungstrainer 2.0 */
.whyhero{padding:27px 30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,var(--paper),var(--paper2));box-shadow:var(--shadow-sm);margin:19px 0}

<script>
'use strict';
const DB={"lessons":[{"id":"grundlagen","title":"Hauptsatz & Gliedsatz","short":"HS und GS sicher erkennen","icon":"layers","level":1,"time":12,"desc":"Erkenne, welche Satzteile selbstständig sind und wo ein Gliedsatz beginnt und endet.","theory":[["Hauptsatz (HS)","Ein Hauptsatz kann grundsätzlich alleine stehen. Beim normalen Aussagesatz steht das konjugierte Verb meist an zweiter Satzgliedposition.","Ich lerne heute Deutsch."],["Gliedsatz (GS)","Ein Gliedsatz ist einem übergeordneten Satz untergeordnet. Bei typischen eingeleiteten Gliedsätzen steht das konjugierte Verb meist am Ende.","Ich lerne, weil ich morgen einen Test habe."],["Positionen","Der GS kann vor, nach oder mitten im HS stehen. Eingeschobene GS brauchen meist zwei Beistriche.","Wenn ich fertig bin, gehe ich heim. / Ich gehe, wenn ich fertig bin, heim."]],"tip":"Markiere zuerst alle konjugierten Verben. Prüfe dann, welche Satzteile HS und GS sind.","trap":"Ein Einleitewort allein ist kein Beweis: „wegen des Regens“ ist kein GS."},{"id":"aufzaehlung","title":"Aufzählungen & Adjektive","short":"Gleichrangige Elemente erkennen","icon":"list","level":1,"time":12,"desc":"Lerne Aufzählungen von festen Wortverbindungen zu unterscheiden.","theory":[["Aufzählungen","Zwischen gleichrangigen Aufzählungsgliedern stehen Beistriche. Vor einem abschließenden „und“ oder „oder“ normalerweise nicht.","Wir brauchen Hefte, Stifte, Bücher und Papier."],["Gleichrangige Adjektive","Wenn „und“ zwischen zwei Adjektive passt, ist häufig ein Beistrich nötig.","Ein großer, heller Raum."],["Nicht gleichrangig","Bei engeren Adjektivverbindungen steht kein Beistrich.","Ein schönes rotes Kleid."]],"tip":"Probiere bei Adjektiven „und“: „ein großes und helles Zimmer“ funktioniert.","trap":"Nicht vor jedes „und“ oder jedes zweite Adjektiv einen Beistrich setzen."},{"id":"hauptsatzreihe","title":"Hauptsatzreihen","short":"HS + HS und Bindewörter","icon":"columns","level":1,"time":12,"desc":"Zwei Hauptsätze verbinden: mit Beistrich, mit „aber“ oder mit „und“.","theory":[["Zwei selbstständige HS","Ohne Bindewort stehen zwischen zwei aneinandergereihten HS Beistriche.","Sie liest, er schreibt."],["Aber, sondern, denn, doch","Vor diesen entgegensetzenden oder begründenden Bindewörtern steht meist ein Beistrich.","Er wollte gehen, aber sie blieb."],["Und / oder zwischen HS","Zwischen gleichrangigen vollständigen HS mit „und“ oder „oder“ ist ein Beistrich meist freiwillig.","Ich koche[,] und Mia deckt den Tisch."]],"tip":"Kannst du die beiden Teile als eigene Sätze schreiben? Dann hast du wahrscheinlich zwei HS.","trap":"Bei „und“ zwischen zwei vollständigen HS sind beide Varianten oft richtig – das Training akzeptiert beide."},{"id":"konjunktion","title":"Gliedsätze mit Signalwörtern","short":"Weil, dass, obwohl, wenn ...","icon":"git-branch","level":2,"time":16,"desc":"Konjunktionalsätze sicher abtrennen, auch in verschachtelten Sätzen.","theory":[["Typische Einleitewörter","weil, dass, obwohl, wenn, falls, nachdem, bevor, während, damit, sobald ...","Ich bleibe, weil es regnet."],["GS am Satzanfang","Nach dem einleitenden GS steht der Beistrich vor dem HS.","Obwohl es regnet, spielen wir."],["Mehrere GS","Jeder GS muss vom übergeordneten Satz korrekt abgegrenzt werden. Verbundene gleichrangige GS mit „und/oder“ stehen aber oft ohne Beistrich dazwischen.","Ich weiß, dass er lernt und dass er morgen kommt."]],"tip":"Unterstreiche Signalwort und konjugiertes Verb. Der Bereich dazwischen gehört oft zum GS.","trap":"Nicht einfach vor jedes „und“ einen Beistrich setzen, wenn zwei gleichrangige GS verbunden sind."},{"id":"relativ","title":"Relativsätze & Einschübe","short":"Der, die, das, den, dessen ...","icon":"brackets","level":2,"time":16,"desc":"Zusätzliche Angaben im Satz erkennen und mit zwei Beistrichen einschließen.","theory":[["Relativsatz","Ein Relativsatz beschreibt ein Nomen oder Pronomen genauer und wird mit Beistrichen abgetrennt.","Das Auto, das dort steht, gehört mir."],["Eingeschobener Relativsatz","Wenn der HS danach weitergeht, muss auch hinter dem Relativsatz ein Beistrich stehen.","Die Lehrerin, die uns unterrichtet, ist freundlich."],["Relativpronomen","Häufige Relativpronomen sind der, die, das, den, dem, dessen, deren und welcher.","Der Mann, dessen Hund bellt, wohnt hier."]],"tip":"Frage: „Welches Nomen wird genauer erklärt?“ Ziehe dann eine Klammer um den GS.","trap":"„Das“ kann Artikel, Pronomen oder Relativpronomen sein. Entscheidend ist seine Funktion."},{"id":"indirekt","title":"Indirekte Fragen","short":"Ob, wann, warum, wie ...","icon":"help","level":2,"time":12,"desc":"Erkenne Fragen, die als Gliedsatz in einem anderen Satz stehen.","theory":[["Ja/Nein-Frage indirekt","Ein indirekter Fragesatz mit Ja/Nein-Inhalt beginnt oft mit „ob“.","Ich frage mich, ob er heute kommt."],["W-Frage indirekt","Wörter wie wann, wie, warum, wo, wer und welche leiten indirekte Fragen ein.","Sie fragt, wann der Zug fährt."],["Kein Fragezeichen nötig","Wenn der ganze Satz eine Aussage ist, endet er mit einem Punkt, obwohl ein Fragesatz enthalten ist.","Ich weiß nicht, warum er lacht."]],"tip":"Kannst du aus dem GS eine direkte Frage machen? „Wann beginnt der Test?“","trap":"Nicht jede indirekte Frage ist der ganze Satz: Trenne den GS sauber ab."},{"id":"zusaetze","title":"Apposition, Anrede & Ausruf","short":"Einschübe und persönliche Ansprachen","icon":"message","level":2,"time":13,"desc":"Zusätze zum Nomen sowie Anreden und Ausrufe gezielt abgrenzen.","theory":[["Apposition","Ein nachgestellter Zusatz erklärt ein Nomen genauer. Bei Einschüben werden zwei Beistriche gesetzt.","Lea, meine Nachbarin, spielt Klavier."],["Anrede","Eine direkte Anrede wird durch Beistrich abgetrennt – auch mitten im Satz.","Herr Müller, haben Sie kurz Zeit?"],["Ausruf","Ausrufe und Empfindungswörter werden, wenn sie selbstständig stehen, durch Beistrich abgetrennt.","Ach, das habe ich vergessen!"]],"tip":"Lies den Satz ohne die Zusatzinformation. Bleibt er sinnvoll, könnte eine Apposition vorliegen.","trap":"Nicht jede nähere Bestimmung ist eine Apposition: „mein guter Freund Paul“ benötigt nicht automatisch Beistriche."},{"id":"infinitiv","title":"Infinitivgruppen","short":"Zu lernen, um ... zu, ohne ... zu","icon":"target","level":3,"time":22,"desc":"Die neuen Regeln von 2024 zu erweiterten Infinitivgruppen praktisch beherrschen.","theory":[["Erweiterter zu-Infinitiv","Erweiterte satzwertige Infinitivgruppen mit „zu“ werden seit der Neuregelung 2024 verpflichtend durch Beistriche abgetrennt.","Ich versuche, die Aufgabe schnell zu lösen."],["Einleitung durch Konjunktion","Satzwertige Infinitivgruppen mit „um“, „ohne“, „statt“, „anstatt“, „als“, „außer“ werden durch Beistriche getrennt.","Sie lernt, um die Prüfung zu bestehen."],["Einfacher zu-Infinitiv","Bei einem einfachen, nicht erweiterten zu-Infinitiv kann der Beistrich häufig entfallen.","Sie versprach[,] mitzukommen."],["Eng mit dem Prädikat","Nicht jeder zu-Infinitiv ist eine abzutrennende Infinitivgruppe. Bei mehrteiligen Prädikaten steht kein Beistrich.","Er scheint zu schlafen."]],"tip":"Suche „zu“ + Verb. Frage: Steht ein weiteres Satzglied dabei (z. B. „für die Prüfung“)? Ist „um/ohne/statt“ dabei?","trap":"„Ich habe vor[,] zu lernen“ (einfach) ist anders als „Ich habe vor, heute gründlich zu lernen“ (erweitert)."},{"id":"partizip","title":"Partizipialgruppen","short":"Lachend, verletzt, erschöpft ...","icon":"sparkles","level":3,"time":22,"desc":"Partizip I, Partizip II sowie Pflicht- und Kannbeistriche unterscheiden.","theory":[["Partizip I / II","Partizip I: „lachend“, „zitternd“, „rennend“. Partizip II: „verletzt“, „erschöpft“, „geöffnet“, „getroffen“.","Vor Angst zitternd[,] trat er ein."],["Freie Partizipialgruppe","Eine freie vorangestellte oder verbbezogene Partizipialgruppe kann oft mit oder ohne Beistrich stehen.","Laut lachend[,] betrat sie den Raum."],["Zusatz zu Nomen oder Pronomen","Steht die Partizipialgruppe als nachgestellter Zusatz direkt bei einem Nomen/Pronomen, sind Beistriche Pflicht.","Die Schülerin, vor Aufregung zitternd, begann."],["Nachtrag am Satzende","Steht die Gruppe als nachgetragener Zusatz am Satzende, muss sie mit Beistrich abgetrennt werden.","Er verließ den Raum, sichtbar enttäuscht."]],"tip":"Erkenne zuerst das Partizip. Prüfe dann: Zusatz zum Nomen? Nachtrag am Ende? Oder freie Gruppe?","trap":"Nicht jede Partizipialgruppe braucht Pflichtbeistriche. Bei Kannfällen akzeptiert diese App beide Varianten."},{"id":"rede","title":"Direkte Rede","short":"Beistrich und Begleitsatz","icon":"quote","level":2,"time":12,"desc":"Wörtliche Rede und nachgestellten oder eingeschobenen Begleitsatz verbinden.","theory":[["Begleitsatz folgt","Nach einer wörtlichen Aussage steht der Beistrich nach dem schließenden Anführungszeichen, bevor der Begleitsatz beginnt.","„Ich bin gleich da“, sagte er."],["Frage oder Ausruf","Fragezeichen und Ausrufezeichen bleiben innerhalb der Anführungszeichen; danach folgt der Beistrich vor dem Begleitsatz.","„Bist du bereit?“, fragte sie."],["Begleitsatz zuerst","Steht der Begleitsatz vor der wörtlichen Rede, endet er gewöhnlich mit einem Doppelpunkt.","Sie sagte: „Ich bin bereit.“"]],"tip":"Frag: Wer spricht? Was wird wörtlich gesagt? Wo beginnt der Begleitsatz?","trap":"Das Fragezeichen gehört zur wörtlichen Frage; der Beistrich zum Übergang zum Begleitsatz."},{"id":"fallen","title":"Vergleiche & Beistrichfallen","short":"Als, wie, bitte und bewusst kein Beistrich","icon":"shield","level":3,"time":16,"desc":"Erkenne bewusst die Stellen, an denen kein Beistrich gesetzt werden darf.","theory":[["Vergleiche mit als/wie","Steht nach „als“ oder „wie“ nur ein Vergleich ohne GS, steht normalerweise kein Beistrich.","Sie ist größer als ihre Schwester."],["Vergleich mit GS","Folgt auf „als“ oder „wie“ ein vollständiger GS, ist ein Beistrich nötig.","Sie ist größer, als ich dachte."],["Keine Trennung normaler Satzglieder","Zwischen einer gewöhnlichen vorangestellten Zeit- oder Ortsangabe und dem Prädikat steht kein Beistrich.","Nach dem Training ging er nach Hause."],["„Bitte“ im Satz","„Bitte“ ist nicht automatisch eine Anrede oder ein Ausruf; oft steht kein Beistrich.","Kannst du mir bitte helfen?"]],"tip":"Suche zuerst echte Satz- oder Zusatzgrenzen. Die bloße Sprechpause ist keine Regel.","trap":"Gerade in schwierigen Prüfungen werden falsche Beistriche genauso bewertet wie fehlende."},{"id":"meister","title":"Meisterklasse: gemischte Sätze","short":"Mehrere Regeln gleichzeitig","icon":"trophy","level":3,"time":25,"desc":"Schwierige Testsätze mit 2–5 Beistrichen und verschiedenen Regeln kombiniert.","theory":[["Die Prüfungsstrategie","1. Konjugierte Verben markieren. 2. GS eingrenzen. 3. Infinitiv- und Partizipialgruppen suchen. 4. Zusätze überprüfen. 5. Beistriche setzen.","Obwohl sie müde war, versuchte sie, den Bericht, den sie gestern begonnen hatte, zu beenden."],["Doppelte Beistriche","Ein eingeschobener GS oder Zusatz braucht ein öffnendes und ein schließendes Zeichen.","Das Buch, das du empfohlen hast, war spannend."],["Fehlerkontrolle","Bei jedem gesetzten Beistrich die Regel nennen können. Prüfe auch, ob du einen unerlaubten Beistrich gesetzt hast.","Er verließ, ohne zu zögern, den Raum."]],"tip":"Keine Panik bei langen Sätzen: Löse sie schrittweise in kleinere Einheiten auf.","trap":"Ein Beistrich kann gleichzeitig zwei Aufgaben erfüllen, z. B. Gliedsätze voneinander trennen."}],"exercises":[{"id":"q001","lesson":"grundlagen","level":1,"answer":"Ich lerne, weil morgen ein Test stattfindet.","why":"„Weil“ leitet einen GS ein; er wird vom HS getrennt.","alternatives":[]},{"id":"q002","lesson":"grundlagen","level":1,"answer":"Wenn ich Zeit habe, lese ich ein Buch.","why":"Der GS steht am Anfang; danach folgt der HS.","alternatives":[]},{"id":"q003","lesson":"grundlagen","level":1,"answer":"Sie bleibt, obwohl sie müde ist.","why":"Der mit „obwohl“ eingeleitete GS steht nach dem HS.","alternatives":[]},{"id":"q004","lesson":"grundlagen","level":1,"answer":"Er weiß, dass die Prüfung schwierig wird.","why":"„Dass“ beginnt den GS.","alternatives":[]},{"id":"q005","lesson":"grundlagen","level":1,"answer":"Ich gehe heute in die Schule.","why":"Nur ein HS: Es gibt keinen abzutrennenden GS oder Zusatz.","alternatives":[]},{"id":"q006","lesson":"grundlagen","level":1,"answer":"Falls es regnet, bleiben wir zu Hause.","why":"Der mit „falls“ eingeleitete GS endet vor dem HS.","alternatives":[]},{"id":"q007","lesson":"grundlagen","level":2,"answer":"Wir fahren, sobald der Unterricht endet, nach Hause.","why":"Der GS steht mitten im HS und braucht zwei Beistriche.","alternatives":[]},{"id":"q008","lesson":"grundlagen","level":2,"answer":"Während sie lernt, hört ihr Bruder Musik.","why":"Der Zeit-GS ist vorangestellt.","alternatives":[]},{"id":"q009","lesson":"grundlagen","level":2,"answer":"Er hofft, dass seine Freunde ihn besuchen.","why":"Inhaltssatz mit „dass“.","alternatives":[]},{"id":"q010","lesson":"grundlagen","level":2,"answer":"Nachdem das Spiel vorbei war, gingen alle heim.","why":"Der vorangestellte GS wird mit Beistrich abgeschlossen.","alternatives":[]},{"id":"q011","lesson":"grundlagen","level":3,"answer":"Ich glaube, dass sie kommt, wenn sie Zeit hat.","why":"Zwei GS: „dass ... kommt“ und „wenn ... hat“.","alternatives":[]},{"id":"q012","lesson":"grundlagen","level":3,"answer":"Obwohl ich nicht wusste, wo er wohnt, besuchte ich ihn.","why":"Der „obwohl“-GS enthält selbst eine indirekte Frage.","alternatives":[]},{"id":"q013","lesson":"grundlagen","level":3,"answer":"Ich möchte, wenn die Prüfung vorbei ist, wieder mehr trainieren.","why":"Eingeschobener GS: zwei Beistriche.","alternatives":[]},{"id":"q014","lesson":"grundlagen","level":3,"answer":"Wer regelmäßig übt, verbessert sich.","why":"Der vorangestellte GS mit „wer“ wird vom HS getrennt.","alternatives":[]},{"id":"q015","lesson":"aufzaehlung","level":1,"answer":"Ich kaufe Äpfel, Birnen und Bananen.","why":"Aufzählung von drei gleichrangigen Nomen.","alternatives":[]},{"id":"q016","lesson":"aufzaehlung","level":1,"answer":"Wir lernen Deutsch, Mathematik, Englisch und Spanisch.","why":"Gleichrangige Aufzählung; kein Beistrich vor „und“.","alternatives":[]},{"id":"q017","lesson":"aufzaehlung","level":1,"answer":"Er zeichnet, liest und spielt Fußball.","why":"Gleichrangige Tätigkeiten bilden eine Aufzählung.","alternatives":[]},{"id":"q018","lesson":"aufzaehlung","level":1,"answer":"Auf dem Tisch liegen Hefte, Bücher, Stifte und Blätter.","why":"Aufzählung mit abschließendem „und“.","alternatives":[]},{"id":"q019","lesson":"aufzaehlung","level":1,"answer":"Sie trinkt Wasser und Tee.","why":"Nur zwei Aufzählungsglieder mit „und“: kein Beistrich.","alternatives":[]},{"id":"q020","lesson":"aufzaehlung","level":2,"answer":"Wir brauchen einen großen, hellen Raum.","why":"„Groß“ und „hell“ sind gleichrangige Eigenschaften.","alternatives":[]},{"id":"q021","lesson":"aufzaehlung","level":2,"answer":"Sie trägt ein schönes rotes Kleid.","why":"„Schönes“ bestimmt die Verbindung „rotes Kleid“ näher; keine gleichrangige Aufzählung.","alternatives":[]},{"id":"q022","lesson":"aufzaehlung","level":2,"answer":"Er war müde, hungrig und durstig.","why":"Drei gleichrangige Adjektive.","alternatives":[]},{"id":"q023","lesson":"aufzaehlung","level":2,"answer":"Die Aufgabe war schwierig, aber lösbar.","why":"Vor der entgegensetzenden Konjunktion „aber“ steht ein Beistrich.","alternatives":[]},{"id":"q024","lesson":"aufzaehlung","level":2,"answer":"Morgen benötigen wir Lineal, Bleistift, Radiergummi und Zirkel.","why":"Vier gleichrangige Aufzählungsglieder.","alternatives":[]},{"id":"q025","lesson":"aufzaehlung","level":3,"answer":"Sie kaufte frische Tomaten, reife Paprika, Käse und Brot.","why":"Mehrteilige Aufzählungsglieder werden als Gruppen getrennt.","alternatives":[]},{"id":"q026","lesson":"aufzaehlung","level":3,"answer":"Es war ein kühler, windiger, regnerischer Abend.","why":"Drei gleichrangige Adjektive.","alternatives":[]},{"id":"q027","lesson":"aufzaehlung","level":3,"answer":"Ich mag weder Kaffee noch Tee.","why":"Bei „weder ... noch“ steht in dieser einfachen Verbindung kein Beistrich.","alternatives":[]},{"id":"q028","lesson":"aufzaehlung","level":3,"answer":"Er braucht nicht nur Mut, sondern auch Geduld.","why":"Vor „sondern“ steht ein Beistrich.","alternatives":[]},{"id":"q029","lesson":"hauptsatzreihe","level":1,"answer":"Die Sonne scheint, die Vögel singen.","why":"Zwei HS ohne Bindewort.","alternatives":[]},{"id":"q030","lesson":"hauptsatzreihe","level":1,"answer":"Er liest, sie hört Musik.","why":"Zwei selbstständige HS.","alternatives":[]},{"id":"q031","lesson":"hauptsatzreihe","level":1,"answer":"Ich wollte gehen, aber es regnete.","why":"„Aber“ verbindet zwei entgegengesetzte HS.","alternatives":[]},{"id":"q032","lesson":"hauptsatzreihe","level":1,"answer":"Ich rufe dich an, denn ich habe eine Frage.","why":"Vor „denn“ steht ein Beistrich.","alternatives":[]},{"id":"q033","lesson":"hauptsatzreihe","level":2,"answer":"Sie lernt, und ihr Bruder spielt Fußball.","why":"Zwei vollständige HS mit „und“: der Beistrich ist freiwillig.","alternatives":["Sie lernt und ihr Bruder spielt Fußball."]},{"id":"q034","lesson":"hauptsatzreihe","level":2,"answer":"Entweder du wartest, oder ich gehe allein.","why":"Zwei HS mit „oder“: der Beistrich ist freiwillig.","alternatives":["Entweder du wartest oder ich gehe allein."]},{"id":"q035","lesson":"hauptsatzreihe","level":2,"answer":"Er wollte helfen, doch er hatte keine Zeit.","why":"„Doch“ verbindet hier zwei HS entgegensetzend.","alternatives":[]},{"id":"q036","lesson":"hauptsatzreihe","level":2,"answer":"Nicht Mia hat gewonnen, sondern Lea war schneller.","why":"„Sondern“ trennt entgegengesetzte Satzteile bzw. HS.","alternatives":[]},{"id":"q037","lesson":"hauptsatzreihe","level":2,"answer":"Der Bus kam zu spät, wir verpassten den Beginn.","why":"Zwei HS ohne Bindewort.","alternatives":[]},{"id":"q038","lesson":"hauptsatzreihe","level":3,"answer":"Ich schrieb eine Nachricht, aber niemand antwortete, deshalb rief ich an.","why":"Drei HS; vor „aber“ und vor dem dritten HS stehen Beistriche.","alternatives":[]},{"id":"q039","lesson":"hauptsatzreihe","level":3,"answer":"Er war erschöpft, trotzdem machte er weiter.","why":"Zwei HS; „trotzdem“ steht im zweiten HS.","alternatives":[]},{"id":"q040","lesson":"hauptsatzreihe","level":3,"answer":"Ich habe gelernt, und ich fühle mich bereit.","why":"Zwei vollständige HS mit „und“: Beistrich freiwillig.","alternatives":["Ich habe gelernt und ich fühle mich bereit."]},{"id":"q041","lesson":"hauptsatzreihe","level":3,"answer":"Ich möchte nicht aufgeben, sondern ich werde es erneut versuchen.","why":"Vor „sondern“ steht ein Beistrich.","alternatives":[]},{"id":"q042","lesson":"hauptsatzreihe","level":3,"answer":"Wir nehmen den Zug, oder wir fahren mit dem Auto.","why":"Zwei vollständige HS mit „oder“: Beistrich freiwillig.","alternatives":["Wir nehmen den Zug oder wir fahren mit dem Auto."]},{"id":"q043","lesson":"konjunktion","level":1,"answer":"Sie bleibt drinnen, weil es schneit.","why":"„Weil“ beginnt den GS.","alternatives":[]},{"id":"q044","lesson":"konjunktion","level":1,"answer":"Ich hoffe, dass du morgen kommst.","why":"„Dass“ leitet einen GS ein.","alternatives":[]},{"id":"q045","lesson":"konjunktion","level":1,"answer":"Obwohl er müde war, lernte er weiter.","why":"Der GS steht vor dem HS.","alternatives":[]},{"id":"q046","lesson":"konjunktion","level":2,"answer":"Wir warten, bis der Bus kommt.","why":"„Bis“ leitet einen zeitlichen GS ein.","alternatives":[]},{"id":"q047","lesson":"konjunktion","level":2,"answer":"Er übt, damit er sicherer wird.","why":"„Damit“ leitet einen Ziel-GS ein.","alternatives":[]},{"id":"q048","lesson":"konjunktion","level":2,"answer":"Während sie arbeitete, telefonierte er.","why":"Der GS mit „während“ steht voran.","alternatives":[]},{"id":"q049","lesson":"konjunktion","level":2,"answer":"Bevor wir beginnen, lesen wir die Angabe.","why":"Der vorangestellte GS wird vom HS getrennt.","alternatives":[]},{"id":"q050","lesson":"konjunktion","level":2,"answer":"Er kommt, wenn er Zeit hat, mit uns ins Kino.","why":"Der GS ist eingeschoben und benötigt zwei Beistriche.","alternatives":[]},{"id":"q051","lesson":"konjunktion","level":3,"answer":"Sie sagte, dass sie kommt, sobald der Unterricht vorbei ist.","why":"Zwei GS mit verschiedenen Einleitungen.","alternatives":[]},{"id":"q052","lesson":"konjunktion","level":3,"answer":"Ich weiß, dass du fleißig bist und dass du die Prüfung schaffst.","why":"Zwei gleichrangige „dass“-GS mit „und“; dazwischen kein Beistrich.","alternatives":[]},{"id":"q053","lesson":"konjunktion","level":3,"answer":"Nachdem wir gegessen hatten, räumten wir auf, bevor der Besuch kam.","why":"Ein vorangestellter und ein nachgestellter GS.","alternatives":[]},{"id":"q054","lesson":"konjunktion","level":3,"answer":"Er glaubte, dass er gewinnen würde, obwohl er kaum trainiert hatte.","why":"Zwei GS; der zweite wird durch „obwohl“ eingeleitet.","alternatives":[]},{"id":"q055","lesson":"konjunktion","level":3,"answer":"Wenn du aufmerksam liest, erkennst du, dass der Satz zwei GS enthält.","why":"GS vor und nach dem HS.","alternatives":[]},{"id":"q056","lesson":"konjunktion","level":3,"answer":"Ich bleibe zu Hause, falls ich morgen noch krank bin.","why":"Bedingungs-GS mit „falls“.","alternatives":[]},{"id":"q057","lesson":"relativ","level":1,"answer":"Der Mann, der dort steht, ist mein Lehrer.","why":"Eingeschobener Relativsatz mit zwei Beistrichen.","alternatives":[]},{"id":"q058","lesson":"relativ","level":1,"answer":"Das Buch, das du liest, gehört mir.","why":"„Das du liest“ erklärt „Buch“ genauer.","alternatives":[]},{"id":"q059","lesson":"relativ","level":1,"answer":"Ich kenne jemanden, der sehr gut Spanisch spricht.","why":"Nachgestellter Relativsatz.","alternatives":[]},{"id":"q060","lesson":"relativ","level":2,"answer":"Die Frau, deren Auto kaputt ist, wartet.","why":"Relativsatz mit „deren“.","alternatives":[]},{"id":"q061","lesson":"relativ","level":2,"answer":"Der Schüler, dem ich geholfen habe, bedankt sich.","why":"Relativsatz mit „dem“.","alternatives":[]},{"id":"q062","lesson":"relativ","level":2,"answer":"Der Film, den wir gestern gesehen haben, war spannend.","why":"Der GS ist eingeschoben.","alternatives":[]},{"id":"q063","lesson":"relativ","level":2,"answer":"Ich besuche die Stadt, in der meine Oma lebt.","why":"Relativsatz mit der Präposition „in“.","alternatives":[]},{"id":"q064","lesson":"relativ","level":2,"answer":"Das ist der Stift, mit dem ich immer schreibe.","why":"Relativsatz mit „mit dem“.","alternatives":[]},{"id":"q065","lesson":"relativ","level":3,"answer":"Das Fahrrad, das mein Bruder gekauft hat, obwohl es teuer war, ist schnell.","why":"Relativsatz mit eingebettetem GS.","alternatives":[]},{"id":"q066","lesson":"relativ","level":3,"answer":"Die Lehrerin, die uns unterrichtet, hat gesagt, dass wir üben sollen.","why":"Relativsatz plus „dass“-GS.","alternatives":[]},{"id":"q067","lesson":"relativ","level":3,"answer":"Der Junge, dessen Vater im Krankenhaus arbeitet, ist mein Freund.","why":"Relativsatz mit „dessen“.","alternatives":[]},{"id":"q068","lesson":"relativ","level":3,"answer":"Das Gebäude, vor dem wir stehen, wurde renoviert.","why":"Relativsatz mit „vor dem“.","alternatives":[]},{"id":"q069","lesson":"relativ","level":3,"answer":"Die Aufgaben, die wir heute bekommen haben, sind schwierig.","why":"Die Apposition? Nein: „die ... haben“ ist ein Relativsatz.","alternatives":[]},{"id":"q070","lesson":"relativ","level":3,"answer":"Ich erinnere mich an den Tag, an dem wir uns kennengelernt haben.","why":"Relativsatz nach „Tag“.","alternatives":[]},{"id":"q071","lesson":"indirekt","level":1,"answer":"Ich weiß nicht, ob er kommt.","why":"Indirekte Ja/Nein-Frage mit „ob“.","alternatives":[]},{"id":"q072","lesson":"indirekt","level":1,"answer":"Sie fragt, wann die Stunde beginnt.","why":"Indirekte W-Frage mit „wann“.","alternatives":[]},{"id":"q073","lesson":"indirekt","level":1,"answer":"Kannst du mir sagen, wo der Schlüssel liegt?","why":"Indirekte W-Frage, eingebettet in eine direkte Frage.","alternatives":[]},{"id":"q074","lesson":"indirekt","level":2,"answer":"Wir wissen nicht, warum er fehlt.","why":"Indirekte Frage mit „warum“.","alternatives":[]},{"id":"q075","lesson":"indirekt","level":2,"answer":"Er wollte erfahren, wie die Aufgabe funktioniert.","why":"Indirekte W-Frage mit „wie“.","alternatives":[]},{"id":"q076","lesson":"indirekt","level":2,"answer":"Ich frage mich, wer das gesagt hat.","why":"Indirekte Frage mit „wer“.","alternatives":[]},{"id":"q077","lesson":"indirekt","level":2,"answer":"Ob wir morgen frei haben, weiß noch niemand.","why":"Der indirekte Fragesatz steht vor dem HS.","alternatives":[]},{"id":"q078","lesson":"indirekt","level":2,"answer":"Sie überlegt, welches Buch sie lesen soll.","why":"Indirekte Frage mit „welches“.","alternatives":[]},{"id":"q079","lesson":"indirekt","level":3,"answer":"Ich weiß nicht, ob er kommt und ob er Zeit hat.","why":"Zwei gleichrangige indirekte Fragen mit „und“.","alternatives":[]},{"id":"q080","lesson":"indirekt","level":3,"answer":"Kannst du erklären, warum sie gegangen ist, obwohl sie noch bleiben wollte?","why":"Indirekte Frage mit zusätzlichem „obwohl“-GS.","alternatives":[]},{"id":"q081","lesson":"indirekt","level":3,"answer":"Wir fragten uns, wann der Bus ankommt und wo wir einsteigen müssen.","why":"Zwei gleichrangige indirekte Fragen.","alternatives":[]},{"id":"q082","lesson":"indirekt","level":3,"answer":"Niemand verstand, weshalb er so plötzlich aufstand.","why":"Indirekte Frage mit „weshalb“.","alternatives":[]},{"id":"q083","lesson":"indirekt","level":3,"answer":"Ich möchte wissen, ob die Prüfung schwer ist.","why":"Indirekte Ja/Nein-Frage.","alternatives":[]},{"id":"q084","lesson":"indirekt","level":3,"answer":"Er konnte nicht sagen, wie lange die Fahrt dauern würde.","why":"Indirekte Frage mit „wie lange“.","alternatives":[]},{"id":"q085","lesson":"zusaetze","level":1,"answer":"Lena, meine Schwester, lernt Klavier.","why":"Nachgestellte Apposition als Einschub.","alternatives":[]},{"id":"q086","lesson":"zusaetze","level":1,"answer":"Paul, komm bitte her!","why":"Direkte Anrede.","alternatives":[]},{"id":"q087","lesson":"zusaetze","level":1,"answer":"Herr Meier, haben Sie einen Moment Zeit?","why":"Direkte Anrede am Satzanfang.","alternatives":[]},{"id":"q088","lesson":"zusaetze","level":1,"answer":"Oh nein, ich habe mein Heft vergessen!","why":"Selbstständiger Ausruf.","alternatives":[]},{"id":"q089","lesson":"zusaetze","level":2,"answer":"Der Junge dort, unser Nachbar, spielt Schlagzeug.","why":"„Unser Nachbar“ ist eine Apposition.","alternatives":[]},{"id":"q090","lesson":"zusaetze","level":2,"answer":"Ich danke euch, liebe Freunde, für eure Hilfe.","why":"Eingeschobene Anrede.","alternatives":[]},{"id":"q091","lesson":"zusaetze","level":2,"answer":"Das ist Frau Wolf, unsere Lehrerin.","why":"Nachgestellte Apposition am Satzende.","alternatives":[]},{"id":"q092","lesson":"zusaetze","level":2,"answer":"Ach, das wusste ich nicht!","why":"Selbstständige Empfindungsäußerung.","alternatives":[]},{"id":"q093","lesson":"zusaetze","level":2,"answer":"Daniel, kannst du mir die Aufgabe erklären?","why":"Direkte Anrede vor einer Frage.","alternatives":[]},{"id":"q094","lesson":"zusaetze","level":3,"answer":"Herr Direktor, unsere Klasse, die 3AVK, plant einen Ausflug.","why":"Anrede plus eingeschobene Apposition.","alternatives":[]},{"id":"q095","lesson":"zusaetze","level":3,"answer":"Mein Freund Tobias, ein begeisterter Sportler, läuft jeden Morgen.","why":"Nachgestellte Apposition.","alternatives":[]},{"id":"q096","lesson":"zusaetze","level":3,"answer":"Nein, so funktioniert das nicht.","why":"Selbstständige Bekräftigung/Ablehnung.","alternatives":[]},{"id":"q097","lesson":"zusaetze","level":3,"answer":"Du hast recht, mein Freund.","why":"Anrede am Satzende.","alternatives":[]},{"id":"q098","lesson":"zusaetze","level":3,"answer":"Ich frage dich, Anna, ob du heute Zeit hast.","why":"Anrede plus indirekte Frage.","alternatives":[]},{"id":"q099","lesson":"infinitiv","level":1,"answer":"Er versucht, die Aufgabe zu lösen.","why":"Erweiterte satzwertige Infinitivgruppe: Pflichtbeistrich.","alternatives":[]},{"id":"q100","lesson":"infinitiv","level":1,"answer":"Sie lernt, um die Prüfung zu bestehen.","why":"„Um ... zu“ leitet eine satzwertige Infinitivgruppe ein.","alternatives":[]},{"id":"q101","lesson":"infinitiv","level":1,"answer":"Er ging, ohne sich zu verabschieden.","why":"Satzwertige Gruppe mit „ohne“.","alternatives":[]},{"id":"q102","lesson":"infinitiv","level":1,"answer":"Sie hat den Wunsch, Ärztin zu werden.","why":"Die Infinitivgruppe hängt vom Nomen „Wunsch“ ab.","alternatives":[]},{"id":"q103","lesson":"infinitiv","level":2,"answer":"Sie versprach, mitzukommen.","why":"Einfacher Infinitiv: Hier ist der Beistrich freiwillig.","alternatives":["Sie versprach mitzukommen."]},{"id":"q104","lesson":"infinitiv","level":2,"answer":"Er scheint zu schlafen.","why":"„Scheint zu schlafen“ gehört zu einem mehrteiligen Prädikat; kein Beistrich.","alternatives":[]},{"id":"q105","lesson":"infinitiv","level":2,"answer":"Ich hoffe, morgen länger schlafen zu können.","why":"Erweiterte satzwertige Infinitivgruppe.","alternatives":[]},{"id":"q106","lesson":"infinitiv","level":2,"answer":"Anstatt lange zu diskutieren, sollten wir anfangen.","why":"Mit „anstatt“ eingeleitete Infinitivgruppe.","alternatives":[]},{"id":"q107","lesson":"infinitiv","level":2,"answer":"Sie war bereit, Verantwortung zu übernehmen.","why":"Vom Adjektiv „bereit“ abhängige Infinitivgruppe.","alternatives":[]},{"id":"q108","lesson":"infinitiv","level":2,"answer":"Er hat Angst, die Prüfung nicht zu bestehen.","why":"Erweiterte Infinitivgruppe, abhängig von „Angst“.","alternatives":[]},{"id":"q109","lesson":"infinitiv","level":2,"answer":"Wir planen, nächste Woche einen Ausflug zu machen.","why":"Erweiterter Infinitiv mit weiteren Satzgliedern.","alternatives":[]},{"id":"q110","lesson":"infinitiv","level":3,"answer":"Ohne auf den Verkehr zu achten, überquerte er die Straße.","why":"Vorangestellte Infinitivgruppe mit „ohne“.","alternatives":[]},{"id":"q111","lesson":"infinitiv","level":3,"answer":"Die Lehrerin bat uns, die Aufgaben sauber abzuschreiben.","why":"Erweiterte Infinitivgruppe.","alternatives":[]},{"id":"q112","lesson":"infinitiv","level":3,"answer":"Ihr Ziel, die Meisterschaft zu gewinnen, gab ihr Kraft.","why":"Infinitivgruppe als Einschub; zwei Beistriche.","alternatives":[]},{"id":"q113","lesson":"infinitiv","level":3,"answer":"Er versuchte, den Text, den wir bekommen hatten, genau zu verstehen.","why":"Erweiterte Infinitivgruppe mit eingeschobenem Relativsatz.","alternatives":[]},{"id":"q114","lesson":"infinitiv","level":3,"answer":"Ich habe beschlossen, heute zu lernen, statt meine Zeit zu verschwenden.","why":"Zwei satzwertige Infinitivgruppen.","alternatives":[]},{"id":"q115","lesson":"infinitiv","level":3,"answer":"Sie begann zu lachen.","why":"„Begann zu lachen“ als enger Verbkomplex: kein Beistrich.","alternatives":[]},{"id":"q116","lesson":"infinitiv","level":3,"answer":"Er ließ sich nicht davon abhalten, noch einmal anzutreten.","why":"Erweiterte Infinitivgruppe, angeschlossen über „davon“.","alternatives":[]},{"id":"q117","lesson":"infinitiv","level":3,"answer":"Es ist wichtig, regelmäßig zu üben und die Fehler zu verstehen.","why":"Eine Infinitivgruppe mit zwei durch „und“ verbundenen Infinitiven.","alternatives":[]},{"id":"q118","lesson":"infinitiv","level":3,"answer":"Sie ging los, um vor der Prüfung noch einen Kaffee zu kaufen.","why":"Erweiterte Infinitivgruppe mit „um“.","alternatives":[]},{"id":"q119","lesson":"partizip","level":1,"answer":"Vor Angst zitternd, betrat er das Zimmer.","why":"Vorangestellte freie Partizipialgruppe: Beistrich freiwillig.","alternatives":["Vor Angst zitternd betrat er das Zimmer."]},{"id":"q120","lesson":"partizip","level":1,"answer":"Laut lachend, kam sie die Treppe herunter.","why":"Vorangestellte freie Partizipialgruppe: Beistrich freiwillig.","alternatives":["Laut lachend kam sie die Treppe herunter."]},{"id":"q121","lesson":"partizip","level":1,"answer":"Der Junge, völlig erschöpft, setzte sich hin.","why":"Nachgestellter Zusatz zum Nomen „Junge“: zwei Pflichtbeistriche.","alternatives":[]},{"id":"q122","lesson":"partizip","level":2,"answer":"Er verließ den Raum, sichtbar enttäuscht.","why":"Nachgetragener Zusatz am Satzende: Beistrich Pflicht.","alternatives":[]},{"id":"q123","lesson":"partizip","level":2,"answer":"Sie stand, tief in Gedanken versunken, am Fenster.","why":"Verbbezogene eingeschobene Partizipialgruppe: hier sind beide Varianten zulässig.","alternatives":["Sie stand tief in Gedanken versunken am Fenster."]},{"id":"q124","lesson":"partizip","level":2,"answer":"Die Schülerin, vor Aufregung zitternd, begann ihren Vortrag.","why":"Nachgestellter Zusatz zum Nomen.","alternatives":[]},{"id":"q125","lesson":"partizip","level":2,"answer":"Von einem Ball getroffen, fiel er zu Boden.","why":"Vorangestellte freie Partizipialgruppe: Beistrich freiwillig.","alternatives":["Von einem Ball getroffen fiel er zu Boden."]},{"id":"q126","lesson":"partizip","level":2,"answer":"Die Katze, auf dem Sofa liegend, schlief tief und fest.","why":"Zusatz zum Nomen „Katze“: paarige Beistriche.","alternatives":[]},{"id":"q127","lesson":"partizip","level":2,"answer":"Er ging weiter, leise vor sich hin summend.","why":"Nachgetragener Zusatz am Satzende.","alternatives":[]},{"id":"q128","lesson":"partizip","level":2,"answer":"Sie blieb, vom Lärm genervt, noch eine Weile sitzen.","why":"Verbbezogene eingeschobene Partizipialgruppe: Kannbeistriche.","alternatives":["Sie blieb vom Lärm genervt noch eine Weile sitzen."]},{"id":"q129","lesson":"partizip","level":3,"answer":"Der Lehrer, von den Antworten beeindruckt, lobte die Klasse.","why":"Nachgestellter Zusatz zum Nomen „Lehrer“.","alternatives":[]},{"id":"q130","lesson":"partizip","level":3,"answer":"Seinen Erfolg feiernd, sprang er in die Luft.","why":"Vorangestellte Partizipialgruppe: freiwilliger Beistrich.","alternatives":["Seinen Erfolg feiernd sprang er in die Luft."]},{"id":"q131","lesson":"partizip","level":3,"answer":"Der Fahrer, vom hellen Licht geblendet, bremste sofort.","why":"Nachgestellter Zusatz zum Nomen.","alternatives":[]},{"id":"q132","lesson":"partizip","level":3,"answer":"Sie ging in den Garten, von ihrem Hund begleitet.","why":"Nachgetragener Zusatz am Satzende.","alternatives":[]},{"id":"q133","lesson":"partizip","level":3,"answer":"In Gedanken versunken, bemerkte er das Klingeln nicht.","why":"Vorangestellte freie Partizipialgruppe: Beistrich freiwillig.","alternatives":["In Gedanken versunken bemerkte er das Klingeln nicht."]},{"id":"q134","lesson":"partizip","level":3,"answer":"Der Schüler, den Kopf gesenkt, wartete auf die Note.","why":"Nachgestellter Zusatz zum Nomen; verkürzte Partizipialgruppe.","alternatives":[]},{"id":"q135","lesson":"partizip","level":3,"answer":"Auf dem Sofa sitzend, las sie, völlig entspannt, ihr Buch.","why":"Zwei freie Partizipialgruppen: Die Beistriche sind jeweils freiwillig und bei Einschub paarig.","alternatives":["Auf dem Sofa sitzend las sie völlig entspannt ihr Buch.","Auf dem Sofa sitzend, las sie völlig entspannt ihr Buch.","Auf dem Sofa sitzend las sie, völlig entspannt, ihr Buch."]},{"id":"q136","lesson":"partizip","level":3,"answer":"Er stolperte über den Stein, in sein Handy vertieft.","why":"Nachtrag am Satzende: Beistrich Pflicht.","alternatives":[]},{"id":"q137","lesson":"partizip","level":3,"answer":"Die Kinder, von der Wanderung müde, schliefen sofort ein.","why":"Nachgestellter Zusatz zum Nomen.","alternatives":[]},{"id":"q138","lesson":"partizip","level":3,"answer":"Sichtlich nervös, wartete sie vor dem Klassenzimmer.","why":"Freie vorangestellte Adjektivgruppe: Beistrich freiwillig.","alternatives":["Sichtlich nervös wartete sie vor dem Klassenzimmer."]},{"id":"q139","lesson":"rede","level":1,"answer":"„Ich komme morgen“, sagte Lisa.","why":"Vor dem nachgestellten Begleitsatz steht ein Beistrich.","alternatives":[]},{"id":"q140","lesson":"rede","level":1,"answer":"„Hast du Zeit?“, fragte er.","why":"Fragezeichen innerhalb, Beistrich nach dem schließenden Anführungszeichen.","alternatives":[]},{"id":"q141","lesson":"rede","level":1,"answer":"„Vorsicht!“, rief die Lehrerin.","why":"Ausrufezeichen innerhalb, Beistrich vor dem Begleitsatz.","alternatives":[]},{"id":"q142","lesson":"rede","level":1,"answer":"Er sagte: „Ich bin fertig.“","why":"Begleitsatz zuerst: Doppelpunkt, kein zusätzlicher Beistrich.","alternatives":[]},{"id":"q143","lesson":"rede","level":2,"answer":"„Das ist schwierig“, meinte Tobias.","why":"Beistrich zwischen Rede und Begleitsatz.","alternatives":[]},{"id":"q144","lesson":"rede","level":2,"answer":"„Geh bitte nach Hause“, sagte die Mutter.","why":"Beistrich nach den Anführungszeichen.","alternatives":[]},{"id":"q145","lesson":"rede","level":2,"answer":"„Wo ist mein Heft?“, fragte Anna.","why":"Fragezeichen und nachfolgender Beistrich.","alternatives":[]},{"id":"q146","lesson":"rede","level":2,"answer":"„Das schaffen wir!“, rief die Klasse.","why":"Ausrufezeichen und Beistrich.","alternatives":[]},{"id":"q147","lesson":"rede","level":2,"answer":"„Ich glaube, dass er recht hat“, sagte Paul.","why":"Zusätzlich zum Beistrich vor dem Begleitsatz steht einer vor dem „dass“-GS.","alternatives":[]},{"id":"q148","lesson":"rede","level":3,"answer":"„Wenn ich Zeit habe, komme ich mit“, antwortete sie.","why":"Ein GS innerhalb der Rede und ein Begleitsatz danach.","alternatives":[]},{"id":"q149","lesson":"rede","level":3,"answer":"„Du hast recht“, sagte er, „aber ich bin noch nicht fertig.“","why":"Eingeschobener Begleitsatz; Beistriche trennen die Teile der wörtlichen Rede.","alternatives":[]},{"id":"q150","lesson":"rede","level":3,"answer":"„Kommst du mit?“, fragte Tom, als er aufstand.","why":"Begleitsatz und anschließender GS.","alternatives":[]},{"id":"q151","lesson":"rede","level":3,"answer":"„Heute lernen wir Beistriche“, erklärte Frau Wolf.","why":"Beistrich nach der wörtlichen Aussage.","alternatives":[]},{"id":"q152","lesson":"rede","level":3,"answer":"Mia rief: „Wir haben gewonnen!“","why":"Begleitsatz vor der Rede: kein Beistrich.","alternatives":[]},{"id":"q153","lesson":"fallen","level":1,"answer":"Er ist größer als sein Bruder.","why":"Ein einfacher Vergleich ohne GS braucht keinen Beistrich.","alternatives":[]},{"id":"q154","lesson":"fallen","level":1,"answer":"Sie ist so schnell wie ihre Schwester.","why":"„Wie“ leitet nur eine Vergleichsgruppe ein.","alternatives":[]},{"id":"q155","lesson":"fallen","level":1,"answer":"Nach dem Unterricht gehe ich nach Hause.","why":"Normale Zeitangabe vor dem HS: kein Beistrich.","alternatives":[]},{"id":"q156","lesson":"fallen","level":1,"answer":"Kannst du mir bitte helfen?","why":"„Bitte“ ist hier in den Satz eingebunden; kein Beistrich.","alternatives":[]},{"id":"q157","lesson":"fallen","level":2,"answer":"Es war schwieriger, als ich gedacht hatte.","why":"Auf „als“ folgt ein GS mit konjugiertem Verb.","alternatives":[]},{"id":"q158","lesson":"fallen","level":2,"answer":"Er singt genauso schön, wie seine Mutter früher sang.","why":"Auf „wie“ folgt ein vollständiger GS.","alternatives":[]},{"id":"q159","lesson":"fallen","level":2,"answer":"Ein schönes blaues Hemd liegt auf dem Stuhl.","why":"Die Adjektive sind hier nicht gleichrangig.","alternatives":[]},{"id":"q160","lesson":"fallen","level":2,"answer":"Am frühen Morgen war der See ganz ruhig.","why":"Vor einer Zeitangabe steht kein Beistrich.","alternatives":[]},{"id":"q161","lesson":"fallen","level":2,"answer":"Sie kaufte Milch und Brot.","why":"Zwei einfache Aufzählungsglieder mit „und“.","alternatives":[]},{"id":"q162","lesson":"fallen","level":2,"answer":"Er ist genauso alt wie ich.","why":"Vergleich ohne GS; kein Beistrich.","alternatives":[]},{"id":"q163","lesson":"fallen","level":3,"answer":"Das war anders, als wir erwartet hatten.","why":"„Als“ leitet einen GS ein.","alternatives":[]},{"id":"q164","lesson":"fallen","level":3,"answer":"Trotz des schlechten Wetters gingen wir spazieren.","why":"Präpositionalgruppe am Satzanfang; kein Beistrich.","alternatives":[]},{"id":"q165","lesson":"fallen","level":3,"answer":"Sie war müder, als sie zugeben wollte.","why":"Vergleichs-GS mit „als“.","alternatives":[]},{"id":"q166","lesson":"fallen","level":3,"answer":"Er ist nicht nur nett, sondern auch zuverlässig.","why":"Vor „sondern“ steht ein Beistrich.","alternatives":[]},{"id":"q167","lesson":"fallen","level":3,"answer":"Wie erwartet, bestand sie die Prüfung.","why":"Formelhafter Ausdruck „wie erwartet“: Beistrich freiwillig.","alternatives":["Wie erwartet bestand sie die Prüfung."]},{"id":"q168","lesson":"fallen","level":3,"answer":"Die Schüler, vor allem die neuen, waren aufgeregt.","why":"Eingeschobener erläuternder Zusatz: zwei Beistriche.","alternatives":[]},{"id":"q169","lesson":"fallen","level":3,"answer":"Wenn es schneit, bleiben wir zu Hause.","why":"Trotz Signalwort „wenn“ nur genau ein Beistrich nach dem GS.","alternatives":[]},{"id":"q170","lesson":"fallen","level":3,"answer":"Er wollte sich ausruhen, doch die Arbeit wartete.","why":"Vor dem entgegensetzenden „doch“ steht ein Beistrich.","alternatives":[]},{"id":"q171","lesson":"meister","level":2,"answer":"Obwohl er müde war, versuchte er, die Aufgaben zu lösen.","why":"Anfangs-GS plus erweiterte Infinitivgruppe.","alternatives":[]},{"id":"q172","lesson":"meister","level":2,"answer":"Meine Schwester, die morgen Geburtstag hat, möchte, dass wir gemeinsam feiern.","why":"Relativsatz und „dass“-GS.","alternatives":[]},{"id":"q173","lesson":"meister","level":2,"answer":"Ich weiß nicht, ob die Aufgabe, die wir bekommen haben, schwierig ist.","why":"Indirekte Frage mit eingeschobenem Relativsatz.","alternatives":[]},{"id":"q174","lesson":"meister","level":2,"answer":"Lisa, meine Freundin, sagt, dass sie heute später kommt.","why":"Apposition plus „dass“-GS.","alternatives":[]},{"id":"q175","lesson":"meister","level":2,"answer":"Er blieb zu Hause, weil er krank war, aber seine Freunde gingen schwimmen.","why":"Grund-GS plus HS-Reihe mit „aber“.","alternatives":[]},{"id":"q176","lesson":"meister","level":2,"answer":"Wenn du möchtest, können wir, sobald der Unterricht endet, gemeinsam lernen.","why":"Zwei GS, der zweite ist eingeschoben.","alternatives":[]},{"id":"q177","lesson":"meister","level":3,"answer":"Obwohl die Schülerin nervös war, versuchte sie, den Vortrag, den sie vorbereitet hatte, ruhig zu halten.","why":"GS, erweiterte Infinitivgruppe und Relativsatz.","alternatives":[]},{"id":"q178","lesson":"meister","level":3,"answer":"Der Lehrer, von der Leistung beeindruckt, erklärte, dass alle bestanden hätten.","why":"Partizipialzusatz zum Nomen und „dass“-GS.","alternatives":[]},{"id":"q179","lesson":"meister","level":3,"answer":"Ich hoffe, dass du verstehst, warum wir lernen, bevor der Test beginnt.","why":"„Dass“-GS, indirekte Frage und Zeit-GS.","alternatives":[]},{"id":"q180","lesson":"meister","level":3,"answer":"Mein Bruder, der seit einer Stunde lernt, versucht, den Text ohne Wörterbuch zu verstehen.","why":"Relativsatz plus erweiterte Infinitivgruppe.","alternatives":[]},{"id":"q181","lesson":"meister","level":3,"answer":"Nachdem die Stunde beendet war, verließ die Klasse, über die gute Nachricht erfreut, den Raum.","why":"Vorangestellter GS und eine freie eingeschobene Partizipialgruppe (hier Kannbeistriche).","alternatives":["Nachdem die Stunde beendet war, verließ die Klasse über die gute Nachricht erfreut den Raum."]},{"id":"q182","lesson":"meister","level":3,"answer":"Die Lehrerin, die unsere Tests korrigiert, erklärte uns, wie wir die Fehler vermeiden können.","why":"Relativsatz plus indirekte Frage.","alternatives":[]},{"id":"q183","lesson":"meister","level":3,"answer":"Sie ging nach Hause, ohne ein Wort zu sagen, weil sie sehr enttäuscht war.","why":"Infinitivgruppe und nachgestellter GS.","alternatives":[]},{"id":"q184","lesson":"meister","level":3,"answer":"Das Buch, das ich gestern gekauft habe, ist spannender, als ich erwartet hatte.","why":"Relativsatz und Vergleichs-GS.","alternatives":[]},{"id":"q185","lesson":"meister","level":3,"answer":"Wenn wir uns konzentrieren, können wir lernen, schwierige Texte, die wir zunächst nicht verstehen, richtig zu schreiben.","why":"Vorangestellter GS, erweiterte Infinitivgruppe und Relativsatz.","alternatives":[]},{"id":"q186","lesson":"meister","level":3,"answer":"Der Schüler, vor Angst zitternd, fragte, ob er die Prüfung wiederholen dürfe.","why":"Partizipialzusatz zum Nomen und indirekte Frage.","alternatives":[]},{"id":"q187","lesson":"meister","level":3,"answer":"Sie erklärte, dass sie vorhabe, jeden Tag zu üben, damit sie eine Eins bekomme.","why":"„Dass“-GS, erweiterte Infinitivgruppe und Ziel-GS.","alternatives":[]},{"id":"q188","lesson":"meister","level":3,"answer":"Er wurde, nachdem er lange gelernt hatte, immer sicherer, obwohl die Aufgaben schwieriger wurden.","why":"Zwei GS, einer eingeschoben und einer nachgestellt.","alternatives":[]},{"id":"q189","lesson":"meister","level":3,"answer":"„Wenn ich fertig bin, rufe ich dich an“, sagte Lea, bevor sie das Haus verließ.","why":"Wörtliche Rede mit GS sowie Begleitsatz mit GS.","alternatives":[]},{"id":"q190","lesson":"meister","level":3,"answer":"Der Trainer, der selbst früher gespielt hatte, forderte uns auf, konzentriert zu bleiben.","why":"Relativsatz plus erweiterte Infinitivgruppe.","alternatives":[]},{"id":"q191","lesson":"meister","level":3,"answer":"Ich kann nicht sagen, ob sie kommt, aber ich hoffe, dass sie Zeit hat.","why":"Indirekte Frage, HS-Reihe und „dass“-GS.","alternatives":[]},{"id":"q192","lesson":"meister","level":3,"answer":"Vor Freude strahlend, nahm sie die Urkunde entgegen, die ihr die Direktorin überreichte.","why":"Vorangestellte freie Partizipialgruppe (Kannbeistrich) und Relativsatz.","alternatives":["Vor Freude strahlend nahm sie die Urkunde entgegen, die ihr die Direktorin überreichte."]},{"id":"q193","lesson":"meister","level":3,"answer":"Er wollte wissen, warum wir, obwohl es bereits spät war, noch immer arbeiteten.","why":"Indirekte Frage mit eingeschobenem Grund-GS.","alternatives":[]},{"id":"q194","lesson":"meister","level":3,"answer":"Mia, die neben mir sitzt, hat beschlossen, jeden Tag zwanzig Minuten Deutsch zu üben.","why":"Relativsatz und erweiterte Infinitivgruppe.","alternatives":[]},{"id":"q195","lesson":"meister","level":3,"answer":"Er rannte los, ohne zurückzublicken, während die anderen noch zögerten.","why":"Infinitivgruppe und Zeit-GS.","alternatives":[]},{"id":"q196","lesson":"meister","level":3,"answer":"Die Klasse, die alle Regeln gelernt hatte, wusste, dass Beistriche nicht nach Gefühl gesetzt werden.","why":"Relativsatz und „dass“-GS.","alternatives":[]}]};
const LESSONS=DB.lessons, EX=DB.exercises, BYID=Object.fromEntries(EX.map(q=>[q.id,q]));
const WHYQ=[{"id":"a01","answer":"Ich mag Fußball spielen, Bücher lesen, Comics zeichnen.","category":"aufzaehlung","why":"Die drei Tätigkeiten sind gleichrangige Aufzählungsglieder. Zwischen dem ersten und zweiten sowie zwischen dem zweiten und dritten steht jeweils ein Beistrich.","breakdown":"Glieder: „Fußball spielen“ | „Bücher lesen“ | „Comics zeichnen“","tip":"Test: Kannst du die Tätigkeiten umstellen? Ja – es ist eine Aufzählung.","alternatives":[],"more":false,"keywords":[]},{"id":"a02","answer":"Er isst gern Pizza, sie mag lieber Nudeln.","category":"hauptsatzreihe","why":"„Er isst gern Pizza“ und „sie mag lieber Nudeln“ sind zwei selbstständige Hauptsätze. Ohne Bindewort trennt man sie durch einen Beistrich.","breakdown":"HS 1: Er isst gern Pizza. | HS 2: Sie mag lieber Nudeln.","tip":"Beide Teile könnten alleine als vollständiger Satz stehen.","alternatives":[],"more":false,"keywords":[]},{"id":"a03","answer":"Ich glaube nicht, dass die Batterie ihres Autos noch geladen ist.","category":"konjunktion","why":"„dass“ leitet einen Gliedsatz ein. Er ergänzt die Aussage „Ich glaube nicht“ und wird vom Hauptsatz durch einen Beistrich abgetrennt.","breakdown":"HS: Ich glaube nicht. | GS: dass die Batterie ihres Autos noch geladen ist.","tip":"„dass“ + konjugiertes Verb am Ende („ist“) = typischer GS.","alternatives":[],"more":false,"keywords":[]},{"id":"a04","answer":"Frau Braun kauft den Koffer, den sie im Schaufenster gesehen hat.","category":"relativ","why":"„den sie im Schaufenster gesehen hat“ erklärt „den Koffer“ genauer. Es ist ein Relativsatz (eine Art von Gliedsatz) und wird durch einen Beistrich abgetrennt.","breakdown":"HS: Frau Braun kauft den Koffer. | Relativsatz: den sie im Schaufenster gesehen hat.","tip":"Frage: Welchen Koffer? Den, den sie im Schaufenster gesehen hat.","alternatives":[],"more":false,"keywords":[]},{"id":"a05","answer":"Ich weiß wirklich nicht, woher dieser Dreck auf der Straße kommt.","category":"indirekt","why":"„woher dieser Dreck auf der Straße kommt“ gibt eine Frage indirekt wieder: „Woher kommt dieser Dreck?“ Der indirekte Fragesatz ist ein Gliedsatz und wird abgetrennt.","breakdown":"HS: Ich weiß wirklich nicht. | GS / indirekte Frage: woher dieser Dreck auf der Straße kommt.","tip":"Forme den GS in eine direkte Frage um.","alternatives":[],"more":false,"keywords":[]},{"id":"a06","answer":"Die Maus lief durch das Feld, ohne auf den Raubvogel über ihr zu achten.","category":"infinitiv","why":"„ohne auf den Raubvogel über ihr zu achten“ ist eine Infinitivgruppe mit „ohne ... zu“. Solche Gruppen werden durch einen Beistrich abgetrennt.","breakdown":"HS: Die Maus lief durch das Feld. | Infinitivgruppe: ohne auf den Raubvogel über ihr zu achten.","tip":"„achten“ ist ein Infinitiv mit „zu“, kein konjugiertes Verb; also kein gewöhnlicher GS.","alternatives":[],"more":false,"keywords":[]},{"id":"a07","answer":"Der große Junge dort, unser Nachbar, übt jeden Tag Schlagzeug.","category":"apposition","why":"„unser Nachbar“ ist eine nachgestellte Apposition: ein erklärender Beisatz zum Nomen „Junge“. Da sie eingeschoben ist, stehen zwei Beistriche.","breakdown":"HS ohne Beisatz: Der große Junge dort übt jeden Tag Schlagzeug. | Apposition: unser Nachbar.","tip":"Streiche „unser Nachbar“ weg: Der Satz bleibt grammatisch vollständig.","alternatives":[],"more":false,"keywords":[]},{"id":"a08","answer":"Er ist müde, weil er viel gearbeitet hat.","category":"konjunktion","why":"„weil er viel gearbeitet hat“ ist ein Gliedsatz, der den Grund nennt. Ein Beistrich trennt ihn vom Hauptsatz „Er ist müde“.","breakdown":"HS: Er ist müde. | GS: weil er viel gearbeitet hat.","tip":"„Weil“ ist das Einleitewort; das konjugierte Verb „hat“ steht am Ende.","alternatives":[],"more":false,"keywords":[]},{"id":"a09","answer":"Herr Meier, können Sie sich bitte darum kümmern?","category":"anrede","why":"„Herr Meier“ ist eine direkte Anrede. Wer angesprochen wird, steht hier außerhalb des Satzkerns und wird durch einen Beistrich abgetrennt.","breakdown":"Anrede: Herr Meier | Fragesatz: Können Sie sich bitte darum kümmern?","tip":"Eine Anrede ist keine Apposition: Herr Meier wird direkt angesprochen.","alternatives":[],"more":false,"keywords":[]},{"id":"a10","answer":"Sonja fragt, wann sie dieses Jahr den Urlaub einplanen können.","category":"indirekt","why":"„wann sie dieses Jahr den Urlaub einplanen können“ gibt die Frage „Wann können sie den Urlaub einplanen?“ indirekt wieder. Dieser Gliedsatz steht nach dem Hauptsatz.","breakdown":"HS: Sonja fragt. | GS / indirekte Frage: wann sie dieses Jahr den Urlaub einplanen können.","tip":"Fragewort „wann“ + Verb am Ende („können“).","alternatives":[],"more":false,"keywords":[]},{"id":"a11","answer":"Im Blumenbeet stehen Tulpen, Geranien, Chrysanthemen und Rosen dicht an dicht.","category":"aufzaehlung","why":"Vier Blumenarten werden gleichrangig aufgezählt. Zwischen den ersten drei stehen Beistriche; vor dem abschließenden „und“ steht keiner.","breakdown":"Aufzählung: Tulpen | Geranien | Chrysanthemen und Rosen","tip":"Bei „A, B, C und D“ stehen Beistriche nach A und B, nicht vor und.","alternatives":[],"more":false,"keywords":[]},{"id":"a12","answer":"Tina möchte, falls ihr Auto heute anspringt, zum Einkaufen nach Wien fahren.","category":"konjunktion","why":"„falls ihr Auto heute anspringt“ ist ein eingeschobener Bedingungs-Gliedsatz. Er unterbricht den Hauptsatz und wird deshalb mit zwei Beistrichen eingeklammert.","breakdown":"HS: Tina möchte … zum Einkaufen nach Wien fahren. | GS: falls ihr Auto heute anspringt.","tip":"Streiche den GS: „Tina möchte zum Einkaufen nach Wien fahren.“","alternatives":[],"more":false,"keywords":[]},{"id":"a13","answer":"Endlich trifft die Freundin ein, auf die sie schon im Café gewartet hat.","category":"relativ","why":"„auf die sie schon im Café gewartet hat“ ist ein Relativsatz zu „die Freundin“. Ein Beistrich trennt den nachgestellten Gliedsatz ab.","breakdown":"HS: Endlich trifft die Freundin ein. | Relativsatz: auf die sie schon im Café gewartet hat.","tip":"„auf die“ bezieht sich auf „die Freundin“.","alternatives":[],"more":false,"keywords":[]},{"id":"a14","answer":"Oh nein, die neue Jacke hat einen Riss!","category":"ausruf","why":"„Oh nein“ ist ein selbstständiger Ausruf der Bestürzung. Der Beistrich trennt die Empfindungsäußerung von der folgenden Aussage.","breakdown":"Ausruf: Oh nein | Aussage: Die neue Jacke hat einen Riss!","tip":"Ausruf = Gefühl; Anrede = Person direkt ansprechen.","alternatives":[],"more":false,"keywords":[]},{"id":"a15","answer":"Ich hatte gedacht, dass der Gegner einfacher sein würde.","category":"konjunktion","why":"„dass der Gegner einfacher sein würde“ ist ein mit „dass“ eingeleiteter Gliedsatz. Er wird vom Hauptsatz durch einen Beistrich abgegrenzt.","breakdown":"HS: Ich hatte gedacht. | GS: dass der Gegner einfacher sein würde.","tip":"„dass“ (zwei s) leitet hier den GS ein.","alternatives":[],"more":false,"keywords":[]},{"id":"a16","answer":"Das große Becken ist gesperrt, ich gehe nicht ins Schwimmbad.","category":"hauptsatzreihe","why":"Zwei vollständige Hauptsätze stehen ohne Bindewort nebeneinander. Zwischen „gesperrt“ und „ich“ muss deshalb ein Beistrich stehen.","breakdown":"HS 1: Das große Becken ist gesperrt. | HS 2: Ich gehe nicht ins Schwimmbad.","tip":"Im zweiten HS steht kein GS-Einleitewort; beide Teilsätze stehen selbstständig.","alternatives":[],"more":false,"keywords":[]},{"id":"a17","answer":"Herr Vogel verließ, die Bescheinigung in der Tasche, das Amt.","category":"einschub","why":"„die Bescheinigung in der Tasche“ ist eine eingeschobene Umstandsangabe, genauer eine verkürzte Partizipialkonstruktion (absoluter Akkusativ; sinngemäß: „die Bescheinigung in der Tasche habend“). Die gewählte Zusatz-Lesart wird mit zwei Beistrichen gekennzeichnet.","breakdown":"HS: Herr Vogel verließ … das Amt. | Eingeschobener Zusatz: die Bescheinigung in der Tasche.","tip":"Auf dem Foto steht „Apposition“. Genauer ist es eine eingeschobene verkürzte Partizipialkonstruktion, da die Wortgruppe nicht „Herr Vogel“ umbenennt.","alternatives":["Herr Vogel verließ die Bescheinigung in der Tasche das Amt."],"more":false,"keywords":[]},{"id":"a18","answer":"Die Spinne ist riesig, igitt!","category":"ausruf","why":"„igitt“ ist ein selbstständiger Ausruf, der Ekel ausdrückt. Er wird durch einen Beistrich vom restlichen Satz getrennt.","breakdown":"Aussage: Die Spinne ist riesig. | Ausruf: igitt!","tip":"Das Wort „igitt“ drückt ein Gefühl aus und ist kein Gliedsatz.","alternatives":[],"more":false,"keywords":[]},{"id":"a19","answer":"Ich danke euch, meine lieben Freunde, für eure Unterstützung!","category":"anrede","why":"„meine lieben Freunde“ ist eine direkte Anrede im Satzinneren. Deshalb braucht sie zwei Beistriche – einen davor und einen danach.","breakdown":"Satz ohne Anrede: Ich danke euch für eure Unterstützung! | Anrede: meine lieben Freunde.","tip":"Test: Werden die Freunde angesprochen? Ja. Daher Anrede, nicht Apposition.","alternatives":[],"more":false,"keywords":[]},{"id":"a20","answer":"Für den Geometrietest benötigt ihr rote, grüne und blaue Stifte.","category":"aufzaehlung","why":"„rote“, „grüne“ und „blaue“ sind hier gleichrangige Farben einer Aufzählung. Zwischen „rote“ und „grüne“ steht ein Beistrich, vor „und“ nicht.","breakdown":"Adjektivaufzählung: rote | grüne und blaue Stifte","tip":"Gleichrangige Adjektive: „rote und grüne und blaue Stifte“ ist sinnvoll.","alternatives":[],"more":false,"keywords":[]},{"id":"a21","answer":"„Ich fahre mit“, sagte Petra.","category":"direkte","why":"Nach der wörtlichen Rede folgt der Begleitsatz „sagte Petra“. Beide werden durch einen Beistrich getrennt. Der Punkt der Aussage entfällt innerhalb der Anführungszeichen.","breakdown":"Wörtliche Rede: „Ich fahre mit“ | Begleitsatz: sagte Petra.","tip":"Der Beistrich steht hinter dem schließenden Anführungszeichen.","alternatives":[],"more":false,"keywords":[]},{"id":"a22","answer":"Das hier ist David, unser neuer Schüler.","category":"apposition","why":"„unser neuer Schüler“ ist eine nachgestellte Apposition, die „David“ genauer erklärt. Da sie am Satzende steht, reicht ein Beistrich davor.","breakdown":"HS: Das hier ist David. | Apposition: unser neuer Schüler.","tip":"„David“ und „unser neuer Schüler“ bezeichnen dieselbe Person.","alternatives":[],"more":false,"keywords":[]},{"id":"a23","answer":"Ich weiß nicht, ob ich das schaffe.","category":"indirekt","why":"„ob ich das schaffe“ ist ein indirekter Fragesatz: „Schaffe ich das?“ Er hängt vom Hauptsatz ab und muss durch Beistrich abgetrennt werden.","breakdown":"HS: Ich weiß nicht. | GS / indirekte Frage: ob ich das schaffe.","tip":"„Ob“ leitet hier die indirekte Ja-Nein-Frage ein.","alternatives":[],"more":false,"keywords":[]},{"id":"a24","answer":"Der Skispringer, tief einatmend, begann seinen nächsten Versuch.","category":"partizip","why":"„tief einatmend“ enthält das Partizip I „einatmend“. Als eingeschobener, nachgetragener Zusatz zum Skispringer wird die Partizipialgruppe mit zwei Beistrichen abgetrennt.","breakdown":"HS ohne Zusatz: Der Skispringer begann seinen nächsten Versuch. | Partizipialgruppe: tief einatmend.","tip":"Auf dem Blatt steht „Apposition“. Hier ist „Partizipialgruppe“ die genauere Bezeichnung; „einatmend“ ist Partizip I.","alternatives":[],"more":false,"keywords":[]},{"id":"a25","answer":"Er fuhr los, ohne auf den Verkehr zu achten.","category":"infinitiv","why":"„ohne auf den Verkehr zu achten“ ist eine mit „ohne“ eingeleitete Infinitivgruppe mit „zu“. Der Beistrich ist verpflichtend.","breakdown":"HS: Er fuhr los. | Infinitivgruppe: ohne auf den Verkehr zu achten.","tip":"Die Grundform des Verbs heißt „achten“; mit „zu“ ist es eine Infinitivgruppe.","alternatives":[],"more":false,"keywords":[]},{"id":"a26","answer":"Vor Angst zitternd, ging Lena in das Prüfungszimmer.","category":"partizip","why":"„Vor Angst zitternd“ ist eine vorangestellte freie Partizipialgruppe (Partizip I). Hier darf der Beistrich stehen, muss aber nicht.","breakdown":"Partizipialgruppe: Vor Angst zitternd | HS: ging Lena in das Prüfungszimmer.","tip":"Nicht jede Partizipialgruppe braucht einen Pflichtbeistrich.","alternatives":["Vor Angst zitternd ging Lena in das Prüfungszimmer."],"more":true,"keywords":[]},{"id":"a27","answer":"Der Junge, völlig erschöpft vom Wettkampf, setzte sich hin.","category":"einschub","why":"„völlig erschöpft vom Wettkampf“ ist ein eingeschobener nachgestellter Adjektiv-/Partizipialzusatz zum „Jungen“ und wird durch zwei Beistriche gekennzeichnet.","breakdown":"HS: Der Junge setzte sich hin. | Zusatz: völlig erschöpft vom Wettkampf.","tip":"„Erschöpft“ ist als Partizip II verwendbar; die Gruppe erläutert den Jungen.","alternatives":[],"more":true,"keywords":[]},{"id":"a28","answer":"Obwohl ich lernen wollte, schlief ich ein.","category":"konjunktion","why":"„Obwohl ich lernen wollte“ ist ein vorangestellter Gliedsatz. Vor dem folgenden Hauptsatz steht ein Beistrich.","breakdown":"GS: Obwohl ich lernen wollte | HS: schlief ich ein.","tip":"Bei „obwohl“ erklärt der GS einen Gegensatz.","alternatives":[],"more":true,"keywords":[]},{"id":"a29","answer":"Lea, unsere neue Mitschülerin, die gestern angekommen ist, sitzt vorne.","category":"apposition","why":"Die Apposition „unsere neue Mitschülerin“ erklärt „Lea“; außerdem folgt ein Relativsatz „die gestern angekommen ist“. Beide Einschübe werden durch Beistriche abgetrennt.","breakdown":"HS: Lea sitzt vorne. | Apposition: unsere neue Mitschülerin | Relativsatz: die gestern angekommen ist.","tip":"Hier stecken zwei Regeln im Satz: Apposition und Relativsatz.","alternatives":[],"more":true,"keywords":[]},{"id":"a30","answer":"Er beschloss, jeden Tag eine Stunde Deutsch zu üben.","category":"infinitiv","why":"„jeden Tag eine Stunde Deutsch zu üben“ ist eine erweiterte satzwertige Infinitivgruppe. Der Beistrich steht nach „beschloss“.","breakdown":"HS: Er beschloss. | erweiterte Infinitivgruppe: jeden Tag eine Stunde Deutsch zu üben.","tip":"Seit der Rechtschreibregelung 2024 sind erweiterte satzwertige Infinitivgruppen durch Beistrich abzutrennen.","alternatives":[],"more":true,"keywords":[]},{"id":"a31","answer":"Sie versprach, mitzukommen.","category":"infinitiv","why":"„mitzukommen“ ist ein einfacher zu-Infinitiv. Hier darf ein Beistrich gesetzt werden; er ist nicht verpflichtend.","breakdown":"HS: Sie versprach. | einfacher zu-Infinitiv: mitzukommen.","tip":"Im Gegensatz zur erweiterten satzwertigen Gruppe ist der Beistrich bei einem einfachen Infinitiv hier freiwillig.","alternatives":["Sie versprach mitzukommen."],"more":true,"keywords":[]},{"id":"a32","answer":"Der Hund, laut bellend, rannte durch den Garten.","category":"partizip","why":"„laut bellend“ ist eine Partizipialgruppe mit Partizip I, die als nachgestellter Zusatz zum Nomen „Hund“ eingeschoben wird. Sie steht zwischen zwei Beistrichen.","breakdown":"HS: Der Hund rannte durch den Garten. | Partizipialzusatz: laut bellend.","tip":"Prüfe: „bellend“ = Partizip I, „laut“ erweitert es.","alternatives":[],"more":true,"keywords":[]},{"id":"a33","answer":"Er geht nach Hause, ohne sich zu verabschieden, weil er müde ist.","category":"infinitiv","why":"Die Infinitivgruppe „ohne sich zu verabschieden“ steht zwischen zwei Beistrichen; danach folgt zusätzlich ein mit „weil“ eingeleiteter Gliedsatz.","breakdown":"HS: Er geht nach Hause. | Infinitivgruppe: ohne sich zu verabschieden | GS: weil er müde ist.","tip":"Achte auf zwei verschiedene Regeln im selben Satz.","alternatives":[],"more":true,"keywords":[]},{"id":"a34","answer":"Wenn die Prüfung beginnt, werde ich, tief durchatmend, die erste Aufgabe lesen.","category":"partizip","why":"Der GS mit „wenn“ endet vor „werde“. Die freie eingeschobene Partizipialgruppe „tief durchatmend“ kann mit paarigen Beistrichen abgetrennt werden, muss aber nicht.","breakdown":"GS: Wenn die Prüfung beginnt | HS: werde ich … die erste Aufgabe lesen | Partizipialgruppe: tief durchatmend.","tip":"Die Beistriche bei „tief durchatmend“ sind zusammen freiwillig; der GS-Beistrich ist Pflicht.","alternatives":["Wenn die Prüfung beginnt, werde ich tief durchatmend die erste Aufgabe lesen."],"more":true,"keywords":[]},{"id":"a35","answer":"Der Film, den wir gestern gesehen haben, war spannender, als ich erwartet hatte.","category":"relativ","why":"„den wir gestern gesehen haben“ ist ein eingeschobener Relativsatz; „als ich erwartet hatte“ ist ein Vergleichs-Gliedsatz. Beide werden durch Beistriche abgetrennt.","breakdown":"HS: Der Film war spannender. | Relativsatz: den wir gestern gesehen haben | Vergleichs-GS: als ich erwartet hatte.","tip":"Bei „als ich erwartet hatte“ folgt ein GS; darum steht dort ein Beistrich.","alternatives":[],"more":true,"keywords":[]},{"id":"a36","answer":"Sie war schneller als ihr Bruder.","category":"kein","why":"Hier ist „als ihr Bruder“ ein einfacher Vergleich ohne Gliedsatz. Es gibt keinen anderen Beistrichgrund, also bleibt der Satz ohne Beistrich.","breakdown":"HS: Sie war schneller als ihr Bruder.","tip":"Ein Vergleich allein ist kein GS. Es fehlt ein eigenes konjugiertes Verb.","alternatives":[],"more":true,"keywords":[]},{"id":"a37","answer":"Die Lehrerin sagte: „Ihr habt gut gelernt.“","category":"direkte","why":"Der Begleitsatz steht vor der wörtlichen Rede, deshalb folgt ein Doppelpunkt – kein Beistrich. Auch innerhalb des Satzes gibt es keinen Beistrichgrund.","breakdown":"Begleitsatz: Die Lehrerin sagte | direkte Rede: „Ihr habt gut gelernt.“","tip":"Begleitsatz davor = meist Doppelpunkt; danach = Beistrich.","alternatives":[],"more":true,"keywords":[]},{"id":"a38","answer":"Ich weiß nicht, ob er kommt, und sie weiß nicht, wann er zurückfährt.","category":"indirekt","why":"„ob er kommt“ und „wann er zurückfährt“ sind indirekte Fragen. Zusätzlich werden zwei Hauptsätze mit „und“ verbunden; der Beistrich davor ist bei dieser Verbindung freiwillig.","breakdown":"HS 1: Ich weiß nicht | GS 1: ob er kommt | HS 2: sie weiß nicht | GS 2: wann er zurückfährt.","tip":"Beide indirekten Fragen brauchen Beistriche; vor „und“ zwischen den HS ist er freiwillig.","alternatives":["Ich weiß nicht, ob er kommt und sie weiß nicht, wann er zurückfährt."],"more":true,"keywords":[]},{"id":"a39","answer":"Der Skispringer, vor Nervosität zitternd, sprang ab, obwohl der Wind stark war.","category":"partizip","why":"„vor Nervosität zitternd“ ist eine nachgestellte Partizipialgruppe zum „Skispringer“ und wird mit zwei Beistrichen eingeklammert. „obwohl“ leitet einen weiteren GS ein.","breakdown":"HS: Der Skispringer sprang ab | Partizipialgruppe: vor Nervosität zitternd | GS: obwohl der Wind stark war.","tip":"Zwei Regeln: Partizipialgruppe und Gliedsatz.","alternatives":[],"more":true,"keywords":[]},{"id":"a40","answer":"Obwohl er müde war, versuchte er, die Aufgabe, die er bekommen hatte, sorgfältig zu lösen.","category":"infinitiv","why":"Zuerst steht ein „obwohl“-GS; anschließend beginnt eine erweiterte Infinitivgruppe mit „die Aufgabe … sorgfältig zu lösen“. Dazwischen befindet sich ein eingeschobener Relativsatz.","breakdown":"GS 1: Obwohl er müde war | HS: versuchte er | Infinitivgruppe: die Aufgabe … sorgfältig zu lösen | Relativsatz: die er bekommen hatte.","tip":"Verschachtelter Testsatz: GS + Infinitivgruppe + Relativsatz.","alternatives":[],"more":true,"keywords":[]},{"id":"a41","answer":"Ich möchte wissen, weshalb er, vor Freude strahlend, das Zimmer verließ.","category":"indirekt","why":"„weshalb er … das Zimmer verließ“ ist eine indirekte Frage, die durch Beistrich abgegrenzt wird. Die eingeschobene freie Partizipialgruppe „vor Freude strahlend“ darf paarig mit Beistrichen markiert werden.","breakdown":"HS: Ich möchte wissen | GS/indirekte Frage: weshalb er das Zimmer verließ | Partizipialgruppe: vor Freude strahlend.","tip":"Unterscheide den verpflichtenden GS-Beistrich von der freiwilligen Hervorhebung.","alternatives":["Ich möchte wissen, weshalb er vor Freude strahlend das Zimmer verließ."],"more":true,"keywords":[]}];

const ic=(key,cls='')=>`<svg class="ico ${cls}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${ICONS[key]||ICONS.book}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deep=()=>({answers:0,correct:0,mastery:{},mistakes:[],history:[],bestExam:0,streak:0,lastDay:'',dayDone:[],theme:'light'});
function load(){try{return {...deep(),...JSON.parse(localStorage.getItem('kommaklar_v1')||'{}')}}catch{return deep()}}
let store=load();let page='start', lessonId='grundlagen', session=null, selected={}, showCard=false,cardIndex=0,cardOrder=LESSONS.map(x=>x.id),quiz=null,toastTimer=null;
let config={scope:'alle',difficulty:'alle',count:12,examSize:20,examTime:25};
function save(){try{localStorage.setItem('kommaklar_v1',JSON.stringify(store))}catch{}}
function currentDay(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function record(q,pass,source){store.answers++;if(pass)store.correct++;const record=store.mastery[q.id]||{tries:0,rights:0};record.tries++;if(pass)record.rights++;store.mastery[q.id]=record;const found=store.mistakes.indexOf(q.id);if(!pass&&found<0)store.mistakes.push(q.id);if(pass&&found>=0)store.mistakes.splice(found,1);store.history.unshift({id:q.id,pass,source,time:Date.now()});store.history=store.history.slice(0,120);if(store.lastDay!==currentDay()){store.lastDay=currentDay();store.streak=1}else if(store.answers>1){store.streak=1}save()}
const mastered=id=>(store.mastery[id]||{}).rights>0;
const pct=(a,b)=>b?Math.round(100*a/b):0;
const mProgress=k=>{let all=EX.filter(e=>e.lesson===k);return pct(all.filter(e=>mastered(e.id)).length,all.length)};
const learned=()=>EX.filter(e=>mastered(e.id)).length;
function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;el.setAttribute('role','status');document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2700)}
function setTheme(){document.documentElement.dataset.theme=store.theme;document.querySelector('meta[name="theme-color"]').content=store.theme==='dark'?'#0d1423':'#f6f8fc'}
function go(p){page=p;session=null;whySession=null;render();window.scrollTo({top:0,behavior:'instant'})}
const LINKS=[['start','Übersicht','home'],['erklaeren','Arbeitsblatt erklären','book'],['lernen','Lernkapitel','book'],['uebung','Beistriche setzen','target'],['pruefung','Probetest','clock'],['fehler','Fehlertraining','alert'],['karten','Karteikarten','cards']];
function frame(inner){const progress=pct(learned(),EX.length), nav=LINKS.map(([p,n,i])=>`<button class="navitem ${page===p?'active':''}" data-nav="${p}" ${page===p?'aria-current="page"':''}>${ic(i)}<span>${n}</span></button>`).join('');return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">‚</div><div><div class="brandstrong">KommaKlar<span style="color:var(--purple)">.</span></div><div class="branddetail">TRAINIERE FÜR DEINE EINS</div></div></div><div class="navgroup-label">Dein Lernbereich</div>${nav}<div class="sidebar-bottom"><div class="sideprogress"><div class="sidelabel"><span>Lernfortschritt</span><span>${progress}%</span></div><div class="mini-track"><div class="mini-fill" style="width:${progress}%"></div></div><div class="tiny muted">${learned()} von ${EX.length} Sätzen gemeistert</div></div><button class="sidebar-switch" data-action="theme">${ic(store.theme==='dark'?'sun':'moon')} ${store.theme==='dark'?'Helles Design':'Dunkles Design'}</button><div class="sidefoot">3. HAK · HS / GS · Regelstand 2024</div></div></aside><main class="main"><div class="topbar"><div class="breadcrumb">KommaKlar / <strong>${session?'Training':LINKS.find(x=>x[0]===page)?.[1]||'Übersicht'}</strong></div><div class="top-actions"><span class="pill">${ic('trophy')} ${store.bestExam||0}% Bestwert</span><span class="pill"><span class="dot"></span>${learned()} geschafft</span><button data-action="theme" class="btn small secondary" title="Design wechseln" aria-label="Design wechseln">${ic(store.theme==='dark'?'sun':'moon')}</button></div></div><div class="view" id="view">${inner}</div></main></div><nav class="mobile-nav">${LINKS.slice(0,5).map(([p,n,i])=>`<button data-nav="${p}" class="${page===p?'active':''}">${ic(i)}<span>${n.split(' ')[0]}</span></button>`).join('')}</nav>`}
function title(k,t,s){return `<div class="kicker">${esc(k)}</div><h1>${esc(t)}</h1>${s?`<p class="intro">${esc(s)}</p>`:''}`}
function stat(num,label,icon){return `<div class="card stat"><div class="row"><span class="statcap">${esc(label)}</span><span class="spacer"></span>${ic(icon)}</div><div class="statnum">${num}</div></div>`}

function overview(){const streak=store.streak;const recent=store.history.slice(0,10);let pctToday=pct(learned(),EX.length);return `${title('Dein persönlicher Beistrich-Coach','Du kannst dir die Eins erarbeiten.','Verstehe jede Regel, setze Beistriche direkt im Satz und lerne gezielt aus deinen Fehlern. Alles bleibt im Browser gespeichert.')}<section class="hero"><span class="eyebrow">DEIN NÄCHSTER SCHRITT</span><h2>Heute ein paar Regeln verstehen. Morgen schwierige Sätze meistern.</h2><p>196 Setz-Übungen · 41 Begründungsaufgaben · Original-Arbeitsblatt · Probetests</p><div class="row wrap"><button class="btn" data-action="start-day" data-day="1">3-Tage-Lernplan starten ${ic('arrow')}</button><button class="btn ghost" style="color:#fff;border-color:#ffffff75" data-nav="lernen">Kapitel ansehen</button></div></section><div class="whyhero" style="margin-top:16px"><span class="tag purple">DAS IST DEIN SCHWERPUNKT</span><h2>Alle 25 Sätze vom Arbeitsblatt <span style="color:var(--purple)">begründen</span></h2><p>Im echten Test reicht nicht „Beistrich richtig“. Trainiere zusätzlich den Fachbegriff und den Grund, warum der Beistrich steht.</p><button class="btn" data-nav="erklaeren">Begründungstrainer öffnen ${ic('arrow')}</button></div><div class="grid four" style="margin-top:18px">${stat(learned()+' / '+EX.length,'Sätze gemeistert','check')}${stat(store.answers?Math.round(store.correct/store.answers*100)+'%':'–','Trefferquote','target')}${stat(store.mistakes.length,'Offene Fehler','alert')}${stat((store.bestExam||0)+'%','Bester Probetest','trophy')}</div><div class="section-head"><h2 class="heading">Dein Lernplan für 3 Tage</h2><span class="tag">Ca. 60–90 Minuten je Tag</span></div><div class="grid three"><div class="card"><div class="day"><span class="day-number">1</span><div><strong>Grundlagen verstehen</strong><p>HS/GS, Aufzählung, Hauptsatzreihen, Signalwörter, Relativsätze.</p><button class="btn small soft" data-action="start-day" data-day="1">Tag 1 üben</button></div
